<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectoFlex - QR Code</title>
<meta name="theme-color" content="#1a1a2e">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{background:#16213e;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f3460}
.header h1{font-size:18px;color:#e94560}
.nav{display:flex;gap:0;background:#16213e;border-bottom:2px solid #0f3460}
.nav a{flex:1;text-align:center;padding:10px;color:#666;text-decoration:none;font-size:13px;font-weight:600;border-bottom:3px solid transparent}
.nav a:hover{color:#aaa}
.nav a.active{color:#e94560;border-bottom-color:#e94560}
.container{max-width:600px;margin:0 auto;padding:20px}
.section{margin-bottom:20px}
.section h2{font-size:14px;color:#e94560;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:15px}
.tab{padding:8px 16px;border-radius:10px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:#e94560;color:#fff;border-color:#e94560}
.tab:hover{border-color:#e94560}
.form-group{margin-bottom:12px}
.form-group label{display:block;color:#888;font-size:12px;margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:14px;outline:none;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{border-color:#e94560}
.form-group textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px}
.row .form-group{flex:1}
.gen-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.gen-btn:hover{background:#c73651}
.qr-result{text-align:center;margin-top:20px;display:none}
.qr-result canvas{border-radius:12px;background:#fff;padding:16px}
.qr-result img{border-radius:12px;background:#fff;padding:16px;max-width:300px}
.dl-btns{display:flex;gap:10px;justify-content:center;margin-top:15px}
.dl-btn{padding:8px 20px;border-radius:10px;border:2px solid #0f3460;background:transparent;color:#5dade2;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
.dl-btn:hover{border-color:#e94560;color:#e94560}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:40px;height:35px;border:none;border-radius:8px;cursor:pointer;background:transparent}
.color-row label{font-size:12px;color:#888}
</style>
</head>
<body>

<div class="header">
<h1>📋 HectoFlex</h1>
</div>
<div class="nav">
<a href="index.html">📋 Tâches</a>
<a href="qr.html" class="active">📱 QR Code</a>
</div>

<div class="container">
<div class="tabs" id="qrTabs">
<button class="tab active" onclick="setType('url',this)">🔗 Lien</button>
<button class="tab" onclick="setType('vcard',this)">👤 vCard</button>
<button class="tab" onclick="setType('wifi',this)">📶 WiFi</button>
<button class="tab" onclick="setType('text',this)">📝 Texte</button>
</div>

<!-- URL -->
<div class="section" id="form-url">
<div class="form-group">
<label>URL</label>
<input type="url" id="qr-url" placeholder="https://exemple.com">
</div>
</div>

<!-- vCard -->
<div class="section" id="form-vcard" style="display:none">
<div class="row">
<div class="form-group"><label>Prénom</label><input id="vc-prenom" placeholder="Jean"></div>
<div class="form-group"><label>Nom</label><input id="vc-nom" placeholder="Dupont"></div>
</div>
<div class="form-group"><label>Entreprise</label><input id="vc-org" placeholder="HectoFlex"></div>
<div class="form-group"><label>Titre</label><input id="vc-titre" placeholder="Directeur"></div>
<div class="form-group"><label>Téléphone</label><input id="vc-tel" placeholder="+41 79 123 45 67"></div>
<div class="form-group"><label>Email</label><input id="vc-email" placeholder="jean@exemple.com"></div>
<div class="form-group"><label>Site web</label><input id="vc-url" placeholder="https://exemple.com"></div>
<div class="form-group"><label>Adresse</label><input id="vc-adr" placeholder="Rue Example 1, 1000 Lausanne"></div>
</div>

<!-- WiFi -->
<div class="section" id="form-wifi" style="display:none">
<div class="form-group"><label>Nom du réseau (SSID)</label><input id="wifi-ssid" placeholder="MonWiFi"></div>
<div class="form-group"><label>Mot de passe</label><input id="wifi-pass" placeholder="motdepasse123"></div>
<div class="form-group"><label>Sécurité</label>
<select id="wifi-enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="">Aucune</option></select>
</div>
</div>

<!-- Text -->
<div class="section" id="form-text" style="display:none">
<div class="form-group"><label>Texte libre</label><textarea id="qr-text" rows="4" placeholder="Votre texte ici..."></textarea></div>
</div>

<!-- Options -->
<div class="section">
<h2>Options</h2>
<div class="color-row">
<label>Couleur QR :</label><input type="color" id="qr-fg" value="#000000">
<label>Fond :</label><input type="color" id="qr-bg" value="#ffffff">
</div>
<div class="form-group" style="margin-top:10px">
<label>Taille (px)</label>
<input type="number" id="qr-size" value="400" min="100" max="2000" step="50">
</div>
</div>

<button class="gen-btn" onclick="generate()">Générer le QR Code</button>

<div class="qr-result" id="qrResult">
<canvas id="qrCanvas"></canvas>
<div class="dl-btns">
<a class="dl-btn" id="dlPng" download="qrcode.png">⬇ PNG</a>
<a class="dl-btn" id="dlSvg" download="qrcode.svg">⬇ SVG</a>
</div>
</div>
</div>

<script>
let currentType='url';

function setType(t,el){
  currentType=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  ['url','vcard','wifi','text'].forEach(f=>document.getElementById('form-'+f).style.display=f===t?'block':'none');
}

function getData(){
  if(currentType==='url') return document.getElementById('qr-url').value;
  if(currentType==='text') return document.getElementById('qr-text').value;
  if(currentType==='wifi'){
    const s=document.getElementById('wifi-ssid').value;
    const p=document.getElementById('wifi-pass').value;
    const e=document.getElementById('wifi-enc').value;
    return `WIFI:T:${e};S:${s};P:${p};;`;
  }
  if(currentType==='vcard'){
    const fn=document.getElementById('vc-prenom').value;
    const ln=document.getElementById('vc-nom').value;
    const org=document.getElementById('vc-org').value;
    const title=document.getElementById('vc-titre').value;
    const tel=document.getElementById('vc-tel').value;
    const email=document.getElementById('vc-email').value;
    const url=document.getElementById('vc-url').value;
    const adr=document.getElementById('vc-adr').value;
    let v=`BEGIN:VCARD\nVERSION:3.0\nN:${ln};${fn};;;\nFN:${fn} ${ln}\n`;
    if(org)v+=`ORG:${org}\n`;
    if(title)v+=`TITLE:${title}\n`;
    if(tel)v+=`TEL;TYPE=CELL:${tel}\n`;
    if(email)v+=`EMAIL:${email}\n`;
    if(url)v+=`URL:${url}\n`;
    if(adr)v+=`ADR;TYPE=WORK:;;${adr};;;;\n`;
    v+='END:VCARD';
    return v;
  }
  return '';
}

async function generate(){
  const data=getData();
  if(!data){alert('Remplis au moins un champ !');return;}
  const fg=document.getElementById('qr-fg').value;
  const bg=document.getElementById('qr-bg').value;
  const size=parseInt(document.getElementById('qr-size').value)||400;
  const canvas=document.getElementById('qrCanvas');
  const result=document.getElementById('qrResult');

  try{
    await QRCode.toCanvas(canvas,data,{
      width:size,
      margin:2,
      color:{dark:fg,light:bg},
      errorCorrectionLevel:'M'
    });
    result.style.display='block';

    // PNG download
    document.getElementById('dlPng').href=canvas.toDataURL('image/png');

    // SVG download
    const svgStr=await QRCode.toString(data,{type:'svg',width:size,margin:2,color:{dark:fg,light:bg}});
    const blob=new Blob([svgStr],{type:'image/svg+xml'});
    document.getElementById('dlSvg').href=URL.createObjectURL(blob);
  }catch(e){alert('Erreur: '+e.message);}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectoFlex - Tâches</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#16213e;padding:40px;border-radius:16px;width:100%;max-width:360px;text-align:center}
.login-box h1{color:#e94560;margin-bottom:8px;font-size:24px}
.login-box p{color:#666;margin-bottom:25px;font-size:14px}
.pin-input{width:100%;padding:14px;border-radius:10px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:24px;text-align:center;letter-spacing:12px;outline:none;margin-bottom:15px}
.pin-input:focus{border-color:#e94560}
.login-select{width:100%;padding:12px;border-radius:10px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:15px;margin-bottom:12px;outline:none}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.login-btn:hover{background:#c73651}
.login-error{color:#e94560;font-size:13px;margin-top:10px;display:none}
.app{display:none}
.header{background:#16213e;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
.header h1{font-size:18px;color:#e94560}
.header-right{display:flex;align-items:center;gap:10px}
.user-name{color:#aaa;font-size:13px}
.logout-btn{padding:5px 12px;border-radius:8px;border:1px solid #333;background:transparent;color:#666;cursor:pointer;font-size:12px}
.logout-btn:hover{color:#e94560;border-color:#e94560}
.user-tabs{display:flex;gap:6px;padding:12px 20px;background:#16213e;flex-wrap:wrap}
.user-tab{padding:7px 16px;border-radius:18px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.user-tab.active{background:#e94560;color:#fff;border-color:#e94560}
.user-tab:hover{border-color:#e94560}
.container{max-width:800px;margin:0 auto;padding:15px 20px}
.add-section{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.add-section input[type=text]{flex:1;min-width:150px;padding:11px 14px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:14px;outline:none}
.add-section input:focus{border-color:#e94560}
.add-section input::placeholder{color:#555}
.date-row{display:flex;gap:8px;margin-bottom:15px;align-items:center}
.date-row label{color:#666;font-size:12px;white-space:nowrap}
.date-input{padding:8px 10px;border-radius:8px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:13px;outline:none}
.date-input:focus{border-color:#e94560}
.add-btn{padding:11px 18px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap}
.add-btn:hover{background:#c73651}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filter-btn{padding:4px 12px;border-radius:12px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:12px}
.filter-btn.active{background:#0f3460;color:#fff;border-color:#0f3460}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;margin-bottom:6px;background:#16213e;border-radius:10px;border-left:4px solid #0f3460;transition:all .2s}
.task-item.done{opacity:0.45;border-left-color:#2d6a4f}
.task-item.done .task-text{text-decoration:line-through;color:#555}
.task-item.urgent{border-left-color:#e94560}
.task-item.overdue{border-left-color:#ff6b35}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid #444;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.task-check:hover{border-color:#e94560}
.task-item.done .task-check{background:#2d6a4f;border-color:#2d6a4f}
.task-item.done .task-check::after{content:'✓';color:#fff;font-size:12px}
.task-content{flex:1;min-width:0}
.task-text{font-size:14px;line-height:1.4}
.task-meta{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap}
.task-date{font-size:11px;color:#444}
.task-due{font-size:11px;padding:2px 7px;border-radius:8px;background:#1a3a5c;color:#5dade2}
.task-due.overdue{background:#5c1a1a;color:#ff6b35}
.task-due.today{background:#5c4a1a;color:#f4d03f}
.task-tag{font-size:10px;padding:2px 7px;border-radius:8px;background:#5c1a1a;color:#e94560}
.task-owner{font-size:10px;padding:2px 7px;border-radius:8px;background:#0f3460;color:#aaa}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.task-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#555}
.task-btn:hover{color:#e94560}
.task-note{font-size:12px;color:#666;margin-top:3px;font-style:italic}
.note-input{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #0f3460;background:#1a1a2e;color:#ddd;font-size:12px;margin-top:5px;outline:none;resize:none;display:none}
.note-input.show{display:block}
.empty{text-align:center;padding:50px 20px;color:#333}
.empty span{font-size:36px;display:block;margin-bottom:8px}
.stats{display:flex;gap:12px;margin-bottom:12px;font-size:12px;color:#444}
.stats b{color:#e94560}
.sync-status{font-size:11px;color:#333;text-align:center;padding:4px}
.sync-status.ok{color:#2d6a4f}
.sync-status.err{color:#e94560}
.readonly-badge{font-size:10px;padding:3px 10px;border-radius:10px;background:#333;color:#888;margin-bottom:10px;display:inline-block}
.date-sep{font-size:12px;color:#e94560;font-weight:600;padding:8px 0 4px;border-bottom:1px solid #222;margin-bottom:6px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<h1>📋 HectoFlex</h1>
<p>Liste de tâches</p>
<select class="login-select" id="loginUser">
<option value="daniel">Daniel</option>
<option value="marco">Marco</option>
</select>
<input type="password" class="pin-input" id="pinInput" placeholder="PIN" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')login()">
<button class="login-btn" onclick="login()">Connexion</button>
<div class="login-error" id="loginError">PIN incorrect</div>
</div>
</div>

<div class="app" id="app">
<div class="header">
<h1>📋 HectoFlex</h1>
<div class="header-right">
<span class="user-name" id="userName"></span>
<button class="logout-btn" onclick="logout()">⏏</button>
</div>
</div>
<div class="user-tabs" id="tabsBar">
<button class="user-tab active" data-list="personal" onclick="switchList('personal',this)">Mes tâches</button>
<button class="user-tab" data-list="shared" onclick="switchList('shared',this)">Commun</button>
<button class="user-tab" data-list="other" onclick="switchList('other',this)" id="otherTab">—</button>
</div>
<div class="container">
<div class="sync-status" id="syncStatus"></div>
<div class="stats" id="stats"></div>
<div id="addArea">
<div class="add-section">
<input type="text" id="newTask" placeholder="Nouvelle tâche..." onkeydown="if(event.key==='Enter')addTask()">
<button class="add-btn" onclick="addTask()">+ Ajouter</button>
</div>
<div class="date-row">
<label>📅 Échéance :</label>
<input type="date" class="date-input" id="newDue">
</div>
</div>
<div class="filters">
<button class="filter-btn active" onclick="setFilter('all',this)">Tout</button>
<button class="filter-btn" onclick="setFilter('todo',this)">À faire</button>
<button class="filter-btn" onclick="setFilter('done',this)">Fait</button>
<button class="filter-btn" onclick="setFilter('urgent',this)">Urgent</button>
</div>
<ul class="task-list" id="taskList"></ul>
</div>
</div>

<script>
const API = 'https://hf-tasks-api.hectoflex.workers.dev';
let token=null, currentUser=null, currentList='personal', currentFilter='all', tasks=[];
const OTHER = { daniel:'marco', marco:'daniel' };
const NAMES = { daniel:'Daniel', marco:'Marco' };

async function api(path,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token) opts.headers['Authorization']='Bearer '+token;
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  return r.json();
}

async function login(){
  const user=document.getElementById('loginUser').value;
  const pin=document.getElementById('pinInput').value;
  try{
    const res=await api('/login','POST',{user,pin});
    if(res.ok){token=res.token;currentUser=res.user;localStorage.setItem('hf_token',token);localStorage.setItem('hf_user',currentUser);showApp();}
    else{document.getElementById('loginError').style.display='block';document.getElementById('pinInput').value='';setTimeout(()=>document.getElementById('loginError').style.display='none',2000);}
  }catch(e){document.getElementById('loginError').textContent='Erreur connexion';document.getElementById('loginError').style.display='block';}
}

function logout(){localStorage.removeItem('hf_token');localStorage.removeItem('hf_user');token=null;currentUser=null;document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').value='';}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userName').textContent=NAMES[currentUser];
  document.getElementById('otherTab').textContent=NAMES[OTHER[currentUser]];
  loadTasks();
}

const st=localStorage.getItem('hf_token'),su=localStorage.getItem('hf_user');
if(st&&su){token=st;currentUser=su;showApp();}

function switchList(list,el){
  currentList=list;
  document.querySelectorAll('.user-tab').forEach(t=>t.classList.toggle('active',t.dataset.list===list));
  // Hide add area if viewing other's tasks
  document.getElementById('addArea').style.display=list==='other'?'none':'block';
  loadTasks();
}

function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}

function syncStatus(msg,ok=true){const el=document.getElementById('syncStatus');el.textContent=msg;el.className='sync-status '+(ok?'ok':'err');if(ok)setTimeout(()=>el.textContent='',2000);}

async function loadTasks(){
  try{
    let listParam=currentList;
    if(currentList==='other') listParam=OTHER[currentUser];
    tasks=await api('/tasks?list='+listParam);
    syncStatus('✓ Synchronisé');
    render();
  }catch(e){syncStatus('✗ Erreur de sync',false);}
}

async function addTask(){
  const input=document.getElementById('newTask'),due=document.getElementById('newDue');
  const text=input.value.trim();if(!text)return;
  try{
    await api('/tasks','POST',{text,list:currentList,due_date:due.value||null});
    input.value='';due.value='';await loadTasks();
  }catch(e){syncStatus('✗ Erreur',false);}
}

async function toggleDone(id){const t=tasks.find(t=>t.id===id);if(!t)return;const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id,'PUT',{list:l,updates:{done:!t.done,done_at:!t.done?new Date().toISOString():null}});await loadTasks();}catch(e){syncStatus('✗',false);}}

async function toggleUrgent(id){const t=tasks.find(t=>t.id===id);if(!t)return;const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id,'PUT',{list:l,updates:{urgent:!t.urgent}});await loadTasks();}catch(e){syncStatus('✗',false);}}

async function deleteTask(id){if(!confirm('Supprimer ?'))return;const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id+'?list='+l,'DELETE');await loadTasks();}catch(e){syncStatus('✗',false);}}

async function editTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;const n=prompt('Modifier :',t.text);if(n!==null&&n.trim()){const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id,'PUT',{list:l,updates:{text:n.trim()}});await loadTasks();}catch(e){syncStatus('✗',false);}}}

async function setDueDate(id){const t=tasks.find(t=>t.id===id);if(!t)return;const d=prompt('Date échéance (YYYY-MM-DD) :',t.due_date||'');if(d!==null){const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id,'PUT',{list:l,updates:{due_date:d||null}});await loadTasks();}catch(e){syncStatus('✗',false);}}}

function toggleNote(id){const el=document.getElementById('note-'+id);el.classList.toggle('show');if(el.classList.contains('show'))el.focus();}
async function saveNote(id){const val=document.getElementById('note-'+id).value;const l=currentList==='other'?OTHER[currentUser]:currentList;try{await api('/tasks/'+id,'PUT',{list:l,updates:{note:val}});}catch(e){}}

function formatDate(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

function dueStatus(due){
  if(!due)return{cls:'',label:''};
  const today=new Date().toISOString().slice(0,10);
  const d=new Date(due),t=new Date(today);
  const diff=Math.round((d-t)/(86400000));
  if(diff<0)return{cls:'overdue',label:'⚠️ En retard ('+due+')'};
  if(diff===0)return{cls:'today',label:"Aujourd'hui"};
  if(diff===1)return{cls:'',label:'Demain'};
  return{cls:'',label:due.split('-').reverse().join('/')};
}

function render(){
  let filtered=Array.isArray(tasks)?[...tasks]:[];
  const total=filtered.length,done=filtered.filter(t=>t.done).length,urgent=filtered.filter(t=>t.urgent&&!t.done).length;
  document.getElementById('stats').innerHTML=`<b>${total-done}</b> à faire | <b>${done}</b> terminées${urgent?` | <b>${urgent}</b> urgentes`:''}`;

  if(currentFilter==='todo')filtered=filtered.filter(t=>!t.done);
  else if(currentFilter==='done')filtered=filtered.filter(t=>t.done);
  else if(currentFilter==='urgent')filtered=filtered.filter(t=>t.urgent&&!t.done);

  // Sort: undone first, then by due_date (nulls last), then by urgent, then by id
  filtered.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    // Both have due dates → sort by date
    if(a.due_date&&b.due_date)return a.due_date.localeCompare(b.due_date);
    // One has due date → it comes first
    if(a.due_date&&!b.due_date)return -1;
    if(!a.due_date&&b.due_date)return 1;
    if(a.urgent!==b.urgent)return a.urgent?-1:1;
    return b.id-a.id;
  });

  const list=document.getElementById('taskList');
  const isOther=currentList==='other';

  if(!filtered.length){list.innerHTML='<div class="empty"><span>✨</span>Aucune tâche !</div>';return;}

  let html='';
  if(isOther)html+='<div class="readonly-badge">👁 Vue lecture — tâches de '+NAMES[OTHER[currentUser]]+'</div>';

  let lastDateGroup='';
  filtered.forEach(t=>{
    // Date separator
    if(t.due_date&&!t.done){
      const ds=dueStatus(t.due_date);
      const group=t.due_date;
      if(group!==lastDateGroup){
        html+=`<div class="date-sep">📅 ${ds.label||group}</div>`;
        lastDateGroup=group;
      }
    }

    const ds=dueStatus(t.due_date);
    const overdue=ds.cls==='overdue'&&!t.done;
    html+=`
    <li class="task-item ${t.done?'done':''} ${t.urgent?'urgent':''} ${overdue?'overdue':''}">
      <div class="task-check" onclick="toggleDone(${t.id})"></div>
      <div class="task-content">
        <div class="task-text">${t.text}</div>
        ${t.note?'<div class="task-note">📝 '+t.note+'</div>':''}
        <textarea class="note-input" id="note-${t.id}" placeholder="Note..." onblur="saveNote(${t.id})">${t.note||''}</textarea>
        <div class="task-meta">
          <span class="task-date">${formatDate(t.created_at)}</span>
          ${t.due_date?`<span class="task-due ${ds.cls}">📅 ${ds.label}</span>`:''}
          ${t.urgent?'<span class="task-tag">Urgent</span>':''}
          ${t.created_by&&currentList!=='personal'?'<span class="task-owner">par '+t.created_by+'</span>':''}
        </div>
      </div>
      <div class="task-actions">
        <button class="task-btn" onclick="setDueDate(${t.id})" title="Date">📅</button>
        <button class="task-btn" onclick="toggleNote(${t.id})">📝</button>
        <button class="task-btn" onclick="toggleUrgent(${t.id})">${t.urgent?'🔴':'⚪'}</button>
        <button class="task-btn" onclick="editTask(${t.id})">✏️</button>
        <button class="task-btn" onclick="deleteTask(${t.id})">🗑️</button>
      </div>
    </li>`;
  });
  list.innerHTML=html;
}

setInterval(()=>{if(token)loadTasks();},30000);
</script>
</body>
</html>

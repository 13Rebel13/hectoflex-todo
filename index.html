<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectoFlex Tools</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{background:#16213e;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
.header h1{font-size:20px;color:#e94560}
.header-right{display:flex;align-items:center;gap:10px}
.sync-indicator{width:10px;height:10px;border-radius:50%;background:#2d6a4f;transition:background .3s}
.sync-indicator.syncing{background:#e9c46a;animation:pulse .8s infinite}
.sync-indicator.error{background:#e94560}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.logout-btn{padding:5px 12px;border-radius:8px;border:1px solid #444;background:transparent;color:#888;cursor:pointer;font-size:12px}
.logout-btn:hover{border-color:#e94560;color:#e94560}
.list-tabs{display:flex;gap:8px;margin-bottom:12px}
.list-tab{padding:8px 20px;border-radius:20px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.list-tab.active{background:#e94560;color:#fff;border-color:#e94560}
.list-tab:hover{border-color:#e94560}
.cat-tabs{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.cat-tab{padding:4px 12px;border-radius:12px;border:1px solid #333;background:transparent;color:#777;cursor:pointer;font-size:12px;transition:all .2s}
.cat-tab.active{background:#0f3460;color:#fff;border-color:#0f3460}
.cat-tab:hover{border-color:#e94560}
.container{max-width:800px;margin:0 auto;padding:20px}
.add-section{display:flex;gap:10px;margin-bottom:20px}
.add-section input{flex:1;padding:12px 15px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:15px;outline:none}
.add-section input:focus{border-color:#e94560}
.add-section input::placeholder{color:#555}
.add-btn{padding:12px 20px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:15px;cursor:pointer;font-weight:600;white-space:nowrap}
.add-btn:hover{background:#c73651}
.filters{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:15px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:12px}
.filter-btn.active{background:#0f3460;color:#fff;border-color:#0f3460}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin-bottom:8px;background:#16213e;border-radius:10px;border-left:4px solid #0f3460;transition:all .2s}
.task-item.done{opacity:0.5;border-left-color:#2d6a4f}
.task-item.done .task-text{text-decoration:line-through;color:#666}
.task-item.urgent{border-left-color:#e94560}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid #444;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .2s}
.task-check:hover{border-color:#e94560}
.task-item.done .task-check{background:#2d6a4f;border-color:#2d6a4f}
.task-item.done .task-check::after{content:'✓';color:#fff;font-size:13px}
.task-content{flex:1;min-width:0}
.task-text{font-size:15px;line-height:1.4;word-break:break-word}
.task-meta{display:flex;gap:8px;margin-top:5px;align-items:center;flex-wrap:wrap}
.task-date{font-size:11px;color:#555}
.task-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:#0f3460;color:#aaa}
.task-actions{display:flex;gap:6px;flex-shrink:0}
.task-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#666;transition:all .2s}
.task-btn:hover{color:#e94560}
.task-btn.del:hover{color:#ff4444}
.empty{text-align:center;padding:60px 20px;color:#444}
.empty span{font-size:40px;display:block;margin-bottom:10px}
.stats{display:flex;gap:15px;margin-bottom:15px;font-size:13px;color:#555}
.stats span{color:#e94560;font-weight:600}
.note-input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #0f3460;background:#1a1a2e;color:#ddd;font-size:13px;margin-top:6px;outline:none;resize:none;display:none}
.note-input.show{display:block}
.task-note{font-size:12px;color:#777;margin-top:4px;font-style:italic}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px}
.login-screen h1{color:#e94560;font-size:28px}
.login-screen p{color:#666;font-size:14px}
.login-box{display:flex;gap:10px}
.login-box input{padding:14px 18px;border-radius:12px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:20px;text-align:center;width:160px;outline:none;letter-spacing:8px}
.login-box input:focus{border-color:#e94560}
.login-box button{padding:14px 24px;border-radius:12px;border:none;background:#e94560;color:#fff;font-size:16px;cursor:pointer;font-weight:600}
.login-box button:hover{background:#c73651}
.login-error{color:#e94560;font-size:13px;min-height:20px}
.cat-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}

.main-tabs{display:flex;gap:0;margin-bottom:15px;border-bottom:2px solid #0f3460}
.main-tab{padding:10px 20px;border:none;background:transparent;color:#666;cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.main-tab.active{color:#e94560;border-bottom-color:#e94560}
.main-tab:hover{color:#e94560}
.page{display:none}.page.active{display:block}
.qr-section{max-width:500px;margin:0 auto}
.qr-type-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.qr-type-btn{padding:8px 16px;border-radius:20px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.qr-type-btn.active{background:#e94560;color:#fff;border-color:#e94560}
.qr-type-btn:hover{border-color:#e94560}
.qr-form{background:#16213e;border-radius:12px;padding:20px;margin-bottom:20px}
.qr-form label{display:block;font-size:13px;color:#888;margin-bottom:6px;margin-top:12px}
.qr-form label:first-child{margin-top:0}
.qr-form input,.qr-form textarea{width:100%;padding:10px 14px;border-radius:8px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:14px;outline:none;font-family:inherit}
.qr-form input:focus,.qr-form textarea:focus{border-color:#e94560}
.qr-form textarea{resize:vertical;min-height:80px}
.qr-generate-btn{width:100%;padding:14px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px}
.qr-generate-btn:hover{background:#c73651}
.qr-result{text-align:center;margin-top:20px}
.qr-result canvas{border-radius:12px;background:#fff;padding:16px}
.qr-actions{display:flex;gap:10px;justify-content:center;margin-top:15px}
.qr-actions button{padding:10px 20px;border-radius:8px;border:1px solid #444;background:transparent;color:#aaa;cursor:pointer;font-size:13px}
.qr-actions button:hover{border-color:#e94560;color:#e94560}
.qr-logo-section{display:flex;align-items:center;gap:12px;margin-top:12px}
.qr-logo-section label{margin:0;flex-shrink:0}
.qr-logo-preview{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff}
.qr-logo-remove{padding:4px 10px;border-radius:6px;border:1px solid #444;background:transparent;color:#888;cursor:pointer;font-size:11px}
.qr-logo-remove:hover{color:#e94560;border-color:#e94560}

</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js">

// ===== QR CODE =====
let qrType='url', qrLogo=null;

function switchPage(page, btn){
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page==='tasks'?'pageTasks':page==='qr'?'pageQr':'pageCustoms').classList.add('active');
  if(page==='customs')hfcInit();
}

function switchQrType(type, btn){
  qrType=type;
  document.querySelectorAll('.qr-type-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ['qrFormUrl','qrFormText','qrFormVcard','qrFormWifi'].forEach(id=>document.getElementById(id).style.display='none');
  const map={url:'qrFormUrl',text:'qrFormText',vcard:'qrFormVcard',wifi:'qrFormWifi'};
  document.getElementById(map[type]).style.display='block';
}

function loadQrLogo(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    qrLogo=new Image();
    qrLogo.onload=function(){
      document.getElementById('qrLogoPreview').src=e.target.result;
      document.getElementById('qrLogoPreview').style.display='block';
      document.getElementById('qrLogoRemoveBtn').style.display='inline';
    };
    qrLogo.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeQrLogo(){
  qrLogo=null;
  document.getElementById('qrLogoPreview').style.display='none';
  document.getElementById('qrLogoRemoveBtn').style.display='none';
  document.getElementById('qrLogoInput').value='';
}

function getQrData(){
  if(qrType==='url') return document.getElementById('qrUrl').value.trim();
  if(qrType==='text') return document.getElementById('qrText').value.trim();
  if(qrType==='wifi'){
    const ssid=document.getElementById('wifiSsid').value.trim();
    const pass=document.getElementById('wifiPass').value.trim();
    const sec=document.getElementById('wifiSec').value;
    return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
  }
  if(qrType==='vcard'){
    const fn=document.getElementById('vcFirst').value.trim();
    const ln=document.getElementById('vcLast').value.trim();
    const org=document.getElementById('vcOrg').value.trim();
    const title=document.getElementById('vcTitle').value.trim();
    const tel=document.getElementById('vcPhone').value.trim();
    const email=document.getElementById('vcEmail').value.trim();
    const web=document.getElementById('vcWeb').value.trim();
    const addr=document.getElementById('vcAddr').value.trim();
    let vc='BEGIN:VCARD\nVERSION:3.0\n';
    if(fn||ln) vc+=`N:${ln};${fn};;;\nFN:${fn} ${ln}\n`;
    if(org) vc+=`ORG:${org}\n`;
    if(title) vc+=`TITLE:${title}\n`;
    if(tel) vc+=`TEL;TYPE=CELL:${tel}\n`;
    if(email) vc+=`EMAIL:${email}\n`;
    if(web) vc+=`URL:${web}\n`;
    if(addr) vc+=`ADR:;;${addr};;;;\n`;
    vc+='END:VCARD';
    return vc;
  }
  return '';
}

async function generateQR(){
  const data=getQrData();
  if(!data){alert('Veuillez remplir les champs');return}
  const canvas=document.getElementById('qrCanvas');
  try{
    await QRCode.toCanvas(canvas,data,{width:300,margin:2,color:{dark:'#000000',light:'#ffffff'},errorCorrectionLevel:qrLogo?'H':'M'});
    if(qrLogo){
      const ctx=canvas.getContext('2d');
      const size=canvas.width*0.15;
      const x=(canvas.width-size)/2;
      const y=(canvas.height-size)/2;
      const r=size/2;
      ctx.beginPath();
      ctx.arc(x+r,y+r,r+4,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x+r,y+r,r,0,Math.PI*2);
      ctx.clip();
      ctx.drawImage(qrLogo,x,y,size,size);
      ctx.restore();
    }
    document.getElementById('qrResult').style.display='block';
  }catch(e){alert('Erreur: '+e.message)}
}

function downloadQR(format){
  const canvas=document.getElementById('qrCanvas');
  if(format==='png'){
    const link=document.createElement('a');
    link.download='qr-code.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }else{
    QRCode.toString(getQrData(),{type:'svg',width:300,margin:2},function(err,svg){
      if(err)return;
      const blob=new Blob([svg],{type:'image/svg+xml'});
      const link=document.createElement('a');
      link.download='qr-code.svg';
      link.href=URL.createObjectURL(blob);
      link.click();
    });
  }
}

async function copyQR(){
  const canvas=document.getElementById('qrCanvas');
  try{
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    alert('QR copié !');
  }catch(e){alert('Copie impossible sur ce navigateur')}
}

</script>
</head>
<body>

<h1>📋 HectoFlex Tools</h1>
<p>Entrez votre code PIN</p>
<div class="login-box">

<button onclick="doLogin()">→</button>
</div>
<div class="login-error" id="loginError"></div>
</div>
<div id="appScreen" style="display:none">
<div class="header">
<h1>📋 HectoFlex</h1>
<div class="header-right">
<div class="sync-indicator" id="syncDot" title="Sync status"></div>
<span id="userName" style="font-size:13px;color:#888"></span>
<button class="logout-btn" onclick="doLogout()">⏻</button>

</div>
<div class="container">
<div class="main-tabs">
<button class="main-tab active" onclick="switchPage('tasks',this)">📋 Tâches</button>

<div class="page active" id="pageTasks">
<div class="list-tabs">

<button class="list-tab" id="tabShared" onclick="switchList('shared')">Commun</button>
</div>
<div class="cat-tabs" id="catTabs"></div>
<div class="stats" id="stats"></div>
<div class="add-section">
<input type="text" id="newTask" placeholder="Nouvelle tâche..." onkeydown="if(event.key==='Enter')addTask()">
<button class="add-btn" onclick="addTask()">+</button>
</div>
<div class="filters">
<button class="filter-btn active" onclick="setFilter('all',this)">Tout</button>

<div class="qr-section">
<div class="qr-type-tabs">

<button class="qr-type-btn" onclick="switchQrType('text',this)">📝 Texte</button>
<button class="qr-type-btn" onclick="switchQrType('vcard',this)">👤 vCard</button>
<button class="qr-type-btn" onclick="switchQrType('wifi',this)">📶 WiFi</button>
</div>
<div class="qr-form" id="qrFormUrl">
<label>URL</label>
<input type="url" id="qrUrl" placeholder="https://example.com">
</div>
<div class="qr-form" id="qrFormText" style="display:none">
<label>Texte</label>
<textarea id="qrText" placeholder="Entrez votre texte..."></textarea>
</div>
<div class="qr-form" id="qrFormVcard" style="display:none">
<label>Prénom</label>
<input type="text" id="vcFirst" placeholder="Daniel">
<label>Nom</label>
<input type="text" id="vcLast" placeholder="Fraga">
<label>Entreprise</label>
<input type="text" id="vcOrg" placeholder="HectoFlex Customs">
<label>Titre</label>
<input type="text" id="vcTitle" placeholder="Co-fondateur">
<label>Téléphone</label>
<input type="tel" id="vcPhone" placeholder="+41 76 334 13 06">
<label>Email</label>
<input type="email" id="vcEmail" placeholder="info@hectoflex.ch">
<label>Site web</label>
<input type="url" id="vcWeb" placeholder="https://hectoflex.ch">
<label>Adresse</label>
<input type="text" id="vcAddr" placeholder="Chemin des Champs-Courbes 5, 1024 Ecublens">
</div>
<div class="qr-form" id="qrFormWifi" style="display:none">
<label>Nom du réseau (SSID)</label>
<input type="text" id="wifiSsid" placeholder="MonWiFi">
<label>Mot de passe</label>
<input type="text" id="wifiPass" placeholder="motdepasse123">
<label>Sécurité</label>
<select id="wifiSec" style="width:100%;padding:10px 14px;border-radius:8px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:14px;outline:none">
<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="">Aucune</option>
</select>
</div>
<div class="qr-logo-section">
<label style="font-size:13px;color:#888">Logo :</label>
<input type="file" id="qrLogoInput" accept="image/*" style="display:none" onchange="loadQrLogo(this)">
<button onclick="document.getElementById('qrLogoInput').click()" style="padding:6px 14px;border-radius:8px;border:1px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:12px">📷 Ajouter</button>
<img id="qrLogoPreview" class="qr-logo-preview" style="display:none">
<button class="qr-logo-remove" id="qrLogoRemoveBtn" style="display:none" onclick="removeQrLogo()">✕</button>
</div>
<button class="qr-generate-btn" onclick="generateQR()">Générer le QR Code</button>
<div class="qr-result" id="qrResult" style="display:none">
<canvas id="qrCanvas"></canvas>
<div class="qr-actions">
<button onclick="downloadQR('png')">📥 PNG</button>
<button onclick="downloadQR('svg')">📥 SVG</button>
<button onclick="copyQR()">📋 Copier</button>

</div>
</div>
</div>
</div>

<div class="page" id="pageCustoms">
<div id="customsLogin" style="display:none;text-align:center;padding:40px 20px">
  <h3 style="color:#e94560;margin-bottom:12px">HF Customs</h3>
  <p style="color:#888;font-size:13px;margin-bottom:20px">Connectez-vous pour gérer les demandes</p>
  <div style="max-width:300px;margin:0 auto">
    <input type="text" id="hfcCode" placeholder="Code directeur" style="width:100%;padding:12px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:15px;text-align:center;margin-bottom:10px;outline:none">
    <button onclick="hfcLogin()" style="width:100%;padding:12px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Connexion</button>

  <div id="hfcList"></div>
  <div id="hfcDetail" style="display:none"></div>

<script>
const API='https://hf-tasks-api.hectoflex.workers.dev';
const CATEGORIES=['Tout','Général','Marketing','Affaires','Production','Admin','Planning'];
let token=localStorage.getItem('hf_token')||'',currentUser=localStorage.getItem('hf_user')||'',currentList='personal',currentFilter='all',currentCat='Tout',tasks=[],syncTimer=null;

if(token&&currentUser){showApp()}else{document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').focus()}

async function doLogin(){const pin=document.getElementById('pinInput').value;const errEl=document.getElementById('loginError');errEl.textContent='';for(const user of['daniel','marco']){try{const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pin})});const data=await res.json();if(data.ok){token=data.token;currentUser=data.user;localStorage.setItem('hf_token',token);localStorage.setItem('hf_user',currentUser);showApp();return}}catch(e){}}errEl.textContent='PIN incorrect';document.getElementById('pinInput').value='';document.getElementById('pinInput').focus()}

function doLogout(){localStorage.removeItem('hf_token');localStorage.removeItem('hf_user');token='';currentUser='';clearInterval(syncTimer);document.getElementById('appScreen').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').value='';document.getElementById('pinInput').focus()}

function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('appScreen').style.display='block';document.getElementById('userName').textContent=currentUser.charAt(0).toUpperCase()+currentUser.slice(1);renderCatTabs();loadTasks();clearInterval(syncTimer);syncTimer=setInterval(loadTasks,30000)}

function renderCatTabs(){document.getElementById('catTabs').innerHTML=CATEGORIES.map(c=>`<button class="cat-tab${currentCat===c?' active':''}" onclick="switchCat('${c}',this)">${c}</button>`).join('')}

function switchCat(cat,btn){currentCat=cat;document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const input=document.getElementById('newTask');input.placeholder=cat==='Tout'?'Nouvelle tâche...':'Nouvelle tâche '+cat+'...';render()}

function setSyncState(s){document.getElementById('syncDot').className='sync-indicator'+(s==='ok'?'':s==='syncing'?' syncing':' error')}

async function apiFetch(path,opts={}){setSyncState('syncing');try{const res=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(res.status===401){doLogout();return null}const data=await res.json();setSyncState('ok');return data}catch(e){setSyncState('error');return null}}

async function loadTasks(){const data=await apiFetch('/tasks?list='+currentList);if(data&&Array.isArray(data)){tasks=data;render()}}

function switchList(list){currentList=list;document.getElementById('tabPersonal').classList.toggle('active',list==='personal');document.getElementById('tabShared').classList.toggle('active',list==='shared');loadTasks()}

function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render()}

async function addTask(){const input=document.getElementById('newTask');const text=input.value.trim();if(!text)return;const body={text,list:currentList};if(currentCat!=='Tout')body.category=currentCat;const result=await apiFetch('/tasks',{method:'POST',body:JSON.stringify(body)});if(result){input.value='';await loadTasks()}input.focus()}

async function toggleDone(id){const t=tasks.find(t=>t.id===id);if(!t)return;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{done:!t.done,doneAt:!t.done?new Date().toISOString():null}})});await loadTasks()}

async function toggleUrgent(id){const t=tasks.find(t=>t.id===id);if(!t)return;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{urgent:!t.urgent}})});await loadTasks()}

async function deleteTask(id){if(!confirm('Supprimer cette tâche ?'))return;await apiFetch('/tasks/'+id+'?list='+currentList,{method:'DELETE'});await loadTasks()}

async function editTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;const newText=prompt('Modifier la tâche :',t.text);if(newText!==null&&newText.trim()){await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{text:newText.trim()}})});await loadTasks()}}

function toggleNote(id){const el=document.getElementById('note-'+id);el.classList.toggle('show');if(el.classList.contains('show'))el.focus()}

async function saveNote(id){const note=document.getElementById('note-'+id).value;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{note}})})}

function formatDate(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function escHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function render(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length,urgent=tasks.filter(t=>t.urgent&&!t.done).length;
  document.getElementById('stats').innerHTML=`<span>${total-done}</span> à faire | <span>${done}</span> terminées${urgent?` | <span>${urgent}</span> urgentes`:''}`;
  
  let filtered=[...tasks];
  // Category filter
  if(currentCat!=='Tout')filtered=filtered.filter(t=>(t.category||'Général')===currentCat);
  // Status filter
  if(currentFilter==='todo')filtered=filtered.filter(t=>!t.done);
  else if(currentFilter==='done')filtered=filtered.filter(t=>t.done);
  else if(currentFilter==='urgent')filtered=filtered.filter(t=>t.urgent&&!t.done);
  
  filtered.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(a.urgent!==b.urgent)return a.urgent?-1:1;return b.id-a.id});
  
  const list=document.getElementById('taskList');
  if(filtered.length===0){list.innerHTML='<div class="empty"><span>✨</span>Aucune tâche !</div>';return}
  
  list.innerHTML=filtered.map(t=>`<li class="task-item ${t.done?'done':''} ${t.urgent?'urgent':''}">
    <div class="task-check" onclick="toggleDone(${t.id})"></div>
    <div class="task-content">
      <div class="task-text">${escHtml(t.text)}</div>
      ${t.note?'<div class="task-note">📝 '+escHtml(t.note)+'</div>':''}
      <textarea class="note-input" id="note-${t.id}" placeholder="Ajouter une note..." onblur="saveNote(${t.id})">${t.note||''}</textarea>
      <div class="task-meta">
        <span class="task-date">${formatDate(t.created_at||t.created)}</span>
        ${t.category?'<span class="task-tag">'+escHtml(t.category)+'</span>':''}
        ${t.urgent?'<span class="task-tag" style="background:#5c1a1a;color:#e94560">🔴 Urgent</span>':''}
        ${t.created_by&&t.created_by!==currentUser?'<span class="task-tag" style="background:#1a3a5c;color:#6ab0de">👤 '+escHtml(t.created_by)+'</span>':''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-btn" onclick="toggleNote(${t.id})" title="Note">📝</button>
      <button class="task-btn" onclick="toggleUrgent(${t.id})" title="Urgent">${t.urgent?'🔴':'⚪'}</button>
      <button class="task-btn" onclick="editTask(${t.id})" title="Modifier">✏️</button>
      <button class="task-btn del" onclick="deleteTask(${t.id})" title="Supprimer">🗑️</button>
    </div>
  </li>`).join('')}


// ===== QR CODE =====
let qrType='url', qrLogo=null;

function switchPage(page, btn){
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page==='tasks'?'pageTasks':page==='qr'?'pageQr':'pageCustoms').classList.add('active');
  if(page==='customs')hfcInit();
}

function switchQrType(type, btn){
  qrType=type;
  document.querySelectorAll('.qr-type-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ['qrFormUrl','qrFormText','qrFormVcard','qrFormWifi'].forEach(id=>document.getElementById(id).style.display='none');
  const map={url:'qrFormUrl',text:'qrFormText',vcard:'qrFormVcard',wifi:'qrFormWifi'};
  document.getElementById(map[type]).style.display='block';
}

function loadQrLogo(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    qrLogo=new Image();
    qrLogo.onload=function(){
      document.getElementById('qrLogoPreview').src=e.target.result;
      document.getElementById('qrLogoPreview').style.display='block';
      document.getElementById('qrLogoRemoveBtn').style.display='inline';
    };
    qrLogo.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeQrLogo(){
  qrLogo=null;
  document.getElementById('qrLogoPreview').style.display='none';
  document.getElementById('qrLogoRemoveBtn').style.display='none';
  document.getElementById('qrLogoInput').value='';
}

function getQrData(){
  if(qrType==='url') return document.getElementById('qrUrl').value.trim();
  if(qrType==='text') return document.getElementById('qrText').value.trim();
  if(qrType==='wifi'){
    const ssid=document.getElementById('wifiSsid').value.trim();
    const pass=document.getElementById('wifiPass').value.trim();
    const sec=document.getElementById('wifiSec').value;
    return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
  }
  if(qrType==='vcard'){
    const fn=document.getElementById('vcFirst').value.trim();
    const ln=document.getElementById('vcLast').value.trim();
    const org=document.getElementById('vcOrg').value.trim();
    const title=document.getElementById('vcTitle').value.trim();
    const tel=document.getElementById('vcPhone').value.trim();
    const email=document.getElementById('vcEmail').value.trim();
    const web=document.getElementById('vcWeb').value.trim();
    const addr=document.getElementById('vcAddr').value.trim();
    let vc='BEGIN:VCARD\nVERSION:3.0\n';
    if(fn||ln) vc+=`N:${ln};${fn};;;\nFN:${fn} ${ln}\n`;
    if(org) vc+=`ORG:${org}\n`;
    if(title) vc+=`TITLE:${title}\n`;
    if(tel) vc+=`TEL;TYPE=CELL:${tel}\n`;
    if(email) vc+=`EMAIL:${email}\n`;
    if(web) vc+=`URL:${web}\n`;
    if(addr) vc+=`ADR:;;${addr};;;;\n`;
    vc+='END:VCARD';
    return vc;
  }
  return '';
}

async function generateQR(){
  const data=getQrData();
  if(!data){alert('Veuillez remplir les champs');return}
  const canvas=document.getElementById('qrCanvas');
  try{
    await QRCode.toCanvas(canvas,data,{width:300,margin:2,color:{dark:'#000000',light:'#ffffff'},errorCorrectionLevel:qrLogo?'H':'M'});
    if(qrLogo){
      const ctx=canvas.getContext('2d');
      const size=canvas.width*0.15;
      const x=(canvas.width-size)/2;
      const y=(canvas.height-size)/2;
      const r=size/2;
      ctx.beginPath();
      ctx.arc(x+r,y+r,r+4,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x+r,y+r,r,0,Math.PI*2);
      ctx.clip();
      ctx.drawImage(qrLogo,x,y,size,size);
      ctx.restore();
    }
    document.getElementById('qrResult').style.display='block';
  }catch(e){alert('Erreur: '+e.message)}
}

function downloadQR(format){
  const canvas=document.getElementById('qrCanvas');
  if(format==='png'){
    const link=document.createElement('a');
    link.download='qr-code.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }else{
    QRCode.toString(getQrData(),{type:'svg',width:300,margin:2},function(err,svg){
      if(err)return;
      const blob=new Blob([svg],{type:'image/svg+xml'});
      const link=document.createElement('a');
      link.download='qr-code.svg';
      link.href=URL.createObjectURL(blob);
      link.click();
    });
  }
}

async function copyQR(){
  const canvas=document.getElementById('qrCanvas');
  try{
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    alert('QR copié !');
  }catch(e){alert('Copie impossible sur ce navigateur')}
}

const HFC_API='https://hf-customs.hfcustoms.workers.dev';
let hfcToken=localStorage.getItem('hfc_mgr_tk');
let hfcFilterVal='';
const HFC_ST={brouillon:'Brouillon',en_attente:'En attente',valide:'Validé',en_cours:'En cours',termine:'Terminé',facture:'Facturé'};
const HFC_COLORS={brouillon:'#888',en_attente:'#eab308',valide:'#3b82f6',en_cours:'#f97316',termine:'#22c55e',facture:'#a855f7'};

async function hfcInit(){
  if(hfcToken){
    document.getElementById('customsLogin').style.display='none';
    document.getElementById('customsApp').style.display='block';
    hfcRefresh();
  }else{
    try{
      const d=await hfcApi('/api/auth/login',{method:'POST',body:JSON.stringify({code:'admin2026'})});
      hfcToken=d.token;
      localStorage.setItem('hfc_mgr_tk',hfcToken);
      document.getElementById('customsLogin').style.display='none';
      document.getElementById('customsApp').style.display='block';
      hfcRefresh();
    }catch(e){
      document.getElementById('customsLogin').style.display='block';
      document.getElementById('customsApp').style.display='none';
    }
  }
}

async function hfcApi(path,opts={}){
  const h={'Content-Type':'application/json'};
  if(hfcToken)h.Authorization='Bearer '+hfcToken;
  const r=await fetch(HFC_API+path,{...opts,headers:h});
  if(r.status===401){hfcToken=null;localStorage.removeItem('hfc_mgr_tk');hfcInit();throw new Error('Session expirée')}
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Erreur');
  return d;
}

async function hfcLogin(){
  const code=document.getElementById('hfcCode').value.trim();
  if(!code)return;
  try{
    const d=await hfcApi('/api/auth/login',{method:'POST',body:JSON.stringify({code})});
    if(d.vendeur.role!=='directeur'){document.getElementById('hfcLoginErr').textContent='Accès directeur requis';return}
    hfcToken=d.token;
    localStorage.setItem('hfc_mgr_tk',hfcToken);
    hfcInit();
  }catch(e){document.getElementById('hfcLoginErr').textContent=e.message}
}
document.getElementById('hfcCode').addEventListener('keydown',function(e){if(e.key==='Enter')hfcLogin()});

          '<button onclick="document.getElementById(\'hfcFileInput\').click()" style="flex:1;padding:10px;border-radius:8px;border:1px dashed #444;background:transparent;color:#888;cursor:pointer;font-size:12px">Ajouter une photo</button>'+
          '<input type="file" id="hfcFileInput" accept="image/*" capture="environment" style="display:none" onchange="hfcAddPhoto('+o.id+',this.files[0])">'+
        '</div>'+
      '</div>'+
      '<div style="background:#16213e;padding:14px;border-radius:10px">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:10px">Changer le statut</div>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
          statuts.filter(s=>s!==o.statut).map(s=>
            '<button onclick="hfcChangeStatus('+o.id+',\''+s+'\')" style="padding:7px 14px;border-radius:8px;border:1px solid '+HFC_COLORS[s]+';background:transparent;color:'+HFC_COLORS[s]+';cursor:pointer;font-size:12px;font-weight:500">'+HFC_ST[s]+'</button>'
          ).join('')+
        '</div>'+
      '</div>';
    
    // Setup paste for photos
    document.onpaste=function(e){
      var items=e.clipboardData.items;
      for(var i=0;i<items.length;i++){
        if(items[i].type.indexOf('image')!==-1){
          hfcAddPhoto(id,items[i].getAsFile());
          break;
        }
      }
    };
  }catch(e){console.error(e)}
}
async function hfcSaveEdit(id){
  try{
    var data={
      marque:document.getElementById('hfcE_marque').value,
      modele:document.getElementById('hfcE_modele').value,
      numero_vehicule:document.getElementById('hfcE_numero').value,
      couleur:document.getElementById('hfcE_couleur').value,
      prix:parseFloat(document.getElementById('hfcE_prix').value)||0,
      notes:document.getElementById('hfcE_notes').value,
      date_reception:document.getElementById('hfcE_reception').value,
      date_livraison:document.getElementById('hfcE_livraison').value
    };
    await hfcApi('/api/commandes/'+id,{method:'PUT',body:JSON.stringify(data)});
    hfcShowDetail(id);
  }catch(e){alert(e.message)}
}

async function hfcAddPhoto(id,file){
  if(!file||!file.type.startsWith('image/'))return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var o=await hfcApi('/api/commandes/'+id);
      var photos=o.photos||[];
      photos.push(e.target.result);
      await hfcApi('/api/commandes/'+id,{method:'PUT',body:JSON.stringify({photos:photos})});
      hfcShowDetail(id);
    }catch(err){alert(err.message)}
  };
  reader.readAsDataURL(file);
}

async function hfcRemovePhoto(id,index){
  try{
    var o=await hfcApi('/api/commandes/'+id);
    var photos=o.photos||[];
    photos.splice(index,1);
    await hfcApi('/api/commandes/'+id,{method:'PUT',body:JSON.stringify({photos:photos})});
    hfcShowDetail(id);
  }catch(e){alert(e.message)}
}

function hfcBack(){
  document.getElementById('hfcDetail').style.display='none';
  document.getElementById('hfcList').style.display='block';
}

async function hfcChangeStatus(id,statut){
  try{
    await hfcApi('/api/commandes/'+id+'/status',{method:'PUT',body:JSON.stringify({statut})});
    hfcShowDetail(id);
  }catch(e){alert(e.message)}
}

</script>

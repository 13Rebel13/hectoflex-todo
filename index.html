<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f5f5f7;--surface:#ffffff;--surface2:#f0f0f2;--border:#e0e0e5;
  --accent:#FF7300;--accent-dim:rgba(255,115,0,.08);
  --blue:#3b82f6;--green:#16a34a;--red:#dc2626;
  --text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --radius:10px;--radius-lg:14px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1);
}
[data-theme="dark"]{
  --bg:#111119;--surface:#1b1b2a;--surface2:#242438;--border:#2e2e45;
  --accent:#FF7300;--accent-dim:rgba(255,115,0,.15);
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;
  --text:#e4e4ed;--text2:#8888a0;--text3:#55556a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s;padding-bottom:70px}
.header{background:var(--surface);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.header h1{font-size:1.05rem;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:8px}
.sync-indicator{width:10px;height:10px;border-radius:50%;background:var(--green);transition:background .3s}
.sync-indicator.syncing{background:var(--accent);animation:pulse .8s infinite}
.sync-indicator.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.logout-btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .15s}
.logout-btn:hover{border-color:var(--accent);color:var(--accent)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:100;box-shadow:0 -1px 3px rgba(0,0,0,.08)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;font-size:.75rem;color:var(--text2);cursor:pointer;border:none;background:none;transition:color .15s}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button span.nav-icon{font-size:1.4rem;display:flex;align-items:center;justify-content:center}
.sidebar-logo{display:none;padding:15px 5px 10px;border-bottom:1px solid var(--border);text-align:center;overflow:visible;box-sizing:border-box;width:100%}
@media(min-width:768px){
  .bottom-nav{position:fixed!important;left:0!important;top:0!important;bottom:0!important;right:auto!important;width:220px!important;flex-direction:column!important;justify-content:flex-start!important;padding:0!important;border-top:none!important;border-right:1px solid var(--border)!important;box-shadow:var(--shadow)!important;z-index:99}
  .bottom-nav button{padding:14px 24px!important;width:100%!important;text-align:left!important;font-size:.88rem!important;flex-direction:row!important;justify-content:flex-start!important;gap:10px!important;border-radius:0!important}
  .bottom-nav button.active{background:var(--accent-dim)!important;border-left:3px solid var(--accent)!important;color:var(--accent)!important}
  .sidebar-logo{display:block!important}
  .header{margin-left:220px!important}
  .container{margin-left:220px!important;max-width:none!important;width:calc(100% - 220px)!important;padding:20px 30px!important}
  body{padding-bottom:0!important}
}
.container{max-width:800px;margin:0 auto;padding:20px}
.page{display:none}.page.active{display:block}
.list-tabs{display:flex;gap:8px;margin-bottom:12px}
.list-tab{padding:10px 22px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.list-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.list-tab:hover{border-color:var(--accent)}
.cat-tabs{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:.8rem;transition:all .2s}
.cat-tab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.add-section{display:flex;gap:10px;margin-bottom:20px}
.add-section input{flex:1;padding:12px 15px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;outline:none;transition:border-color .15s}
.add-section input:focus{border-color:var(--accent)}
.add-section input::placeholder{color:var(--text3)}
.add-btn{padding:12px 20px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(255,115,0,.3)}
.add-btn:hover{background:#e56800}
.filters{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:15px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .15s}
.filter-btn.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin-bottom:8px;background:var(--surface);border-radius:var(--radius-lg);border-left:4px solid var(--border);transition:all .2s;box-shadow:var(--shadow)}
.task-item.done{opacity:0.5;border-left-color:var(--green)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text3)}
.task-item.urgent{border-left-color:var(--accent)}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .2s}
.task-check:hover{border-color:var(--accent)}
.task-item.done .task-check{background:var(--green);border-color:var(--green)}
.task-item.done .task-check::after{content:'\2713';color:#fff;font-size:13px}
.task-content{flex:1;min-width:0}
.task-text{font-size:.9rem;line-height:1.4;word-break:break-word}
.task-meta{font-size:.7rem;color:var(--text3);margin-top:4px}
.task-actions{display:flex;gap:6px;flex-shrink:0}
.task-actions button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-actions button:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty span{font-size:40px;display:block;margin-bottom:10px}
.stats{display:flex;gap:15px;margin-bottom:15px;font-size:.8rem;color:var(--text3)}
.stats strong{color:var(--text)}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;background:var(--bg)}
.login-screen h1{color:var(--accent);font-size:1.5rem}
.login-screen p{color:var(--text2);font-size:.85rem}
.login-box{display:flex;gap:10px}
.login-box input{padding:14px 18px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;text-align:center;width:160px;outline:none;letter-spacing:8px}
.login-box input:focus{border-color:var(--accent)}
.login-box button{padding:14px 24px;border-radius:var(--radius-lg);border:none;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;font-weight:600;box-shadow:0 1px 2px rgba(255,115,0,.3)}
.login-error{color:var(--red);font-size:.8rem;min-height:20px}
.main-tabs{display:none!important}
.qr-section{max-width:500px;margin:0 auto}
.qr-type-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.qr-type-tab{padding:10px 18px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .15s}
.qr-type-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.qr-form{background:var(--surface);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;border:1px solid var(--border);box-shadow:var(--shadow)}
.qr-form label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:6px;margin-top:12px}
.qr-form input,.qr-form textarea,.qr-form select{width:100%;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem}
.qr-form input:focus,.qr-form textarea:focus{border-color:var(--accent);outline:none}
.qr-preview{background:var(--surface);border-radius:var(--radius-lg);padding:30px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.qr-preview canvas{max-width:100%}
.qr-actions{display:flex;gap:10px;margin-top:15px;justify-content:center;flex-wrap:wrap}
.qr-actions button{padding:10px 20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .15s}
.qr-actions button:hover{border-color:var(--accent);color:var(--accent)}
.qr-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.qr-logo-section{display:flex;align-items:center;gap:12px;margin-top:12px}
.qr-logo-section label{margin:0;flex-shrink:0}
.qr-logo-preview{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff}
.qr-logo-remove{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.7rem}
.qr-logo-remove:hover{color:var(--accent);border-color:var(--accent)}
.sync-indicator{background:#4ecb71}.sync-indicator.syncing{background:#f0ad4e}.sync-indicator.error{background:#e74c3c}
#themeToggle{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 8px;border-radius:var(--radius);cursor:pointer;font-size:.85rem}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<div class="page" id="pageCustoms">
<div id="customsLogin" style="display:none;text-align:center;padding:40px 20px">
  <h3 style="color:#FF7300;margin-bottom:12px">HF Customs</h3>
  <p style="color:#888;font-size:13px;margin-bottom:20px">Connectez-vous pour gérer les demandes</p>
  <div style="max-width:300px;margin:0 auto">
    <input type="text" id="hfcCode" placeholder="Code directeur" style="width:100%;padding:12px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:15px;text-align:center;margin-bottom:10px;outline:none">
    <button onclick="hfcLogin()" style="width:100%;padding:12px;border-radius:10px;border:none;background:#FF7300;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Connexion</button>
    <div id="hfcLoginErr" style="color:#FF7300;font-size:13px;margin-top:8px"></div>
  </div>
</div>
<div id="customsApp" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="color:#FF7300;font-size:16px">Demandes HF Customs</h3>
    <button onclick="hfcRefresh()" style="padding:6px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:12px">Actualiser</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap" id="hfcFilters">
    <button class="filter-btn active" onclick="hfcFilter('',this)">Tous</button>
    <button class="filter-btn" onclick="hfcFilter('en_attente',this)">En attente</button>
    <button class="filter-btn" onclick="hfcFilter('valide',this)">Validé</button>
    <button class="filter-btn" onclick="hfcFilter('en_cours',this)">En cours</button>
    <button class="filter-btn" onclick="hfcFilter('termine',this)">Terminé</button>
    <button class="filter-btn" onclick="hfcFilter('facture',this)">Facturé</button>
    <button class="filter-btn" onclick="hfcFilter('brouillon',this)">Brouillon</button>
  </div>
  <div id="hfcStats" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px"></div>
  <div id="hfcList"></div>
  <div id="hfcDetail" style="display:none"></div>
</div>
</div>
</div>
<script>
const API='https://hf-tasks-api.hectoflex.workers.dev';
const CATEGORIES=['Tout','Général','Marketing','Affaires','Production','Admin','Planning'];
let token=localStorage.getItem('hf_token')||'',currentUser=localStorage.getItem('hf_user')||'',currentList='personal',currentFilter='all',currentCat='Tout',tasks=[],syncTimer=null;

if(token&&currentUser){showApp()}else{document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').focus()}

async function doLogin(){const pin=document.getElementById('pinInput').value;const errEl=document.getElementById('loginError');errEl.textContent='';for(const user of['daniel','marco']){try{const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pin})});const data=await res.json();if(data.ok){token=data.token;currentUser=data.user;localStorage.setItem('hf_token',token);localStorage.setItem('hf_user',currentUser);showApp();return}}catch(e){}}errEl.textContent='PIN incorrect';document.getElementById('pinInput').value='';document.getElementById('pinInput').focus()}

function doLogout(){localStorage.removeItem('hf_token');localStorage.removeItem('hf_user');token='';currentUser='';clearInterval(syncTimer);document.getElementById('appScreen').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').value='';document.getElementById('pinInput').focus()}

function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('appScreen').style.display='block';document.getElementById('userName').textContent=currentUser.charAt(0).toUpperCase()+currentUser.slice(1);renderCatTabs();loadTasks();clearInterval(syncTimer);syncTimer=setInterval(loadTasks,30000)}

function renderCatTabs(){document.getElementById('catTabs').innerHTML=CATEGORIES.map(c=>`<button class="cat-tab${currentCat===c?' active':''}" onclick="switchCat('${c}',this)">${c}</button>`).join('')}

function switchCat(cat,btn){currentCat=cat;document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const input=document.getElementById('newTask');input.placeholder=cat==='Tout'?'Nouvelle tâche...':'Nouvelle tâche '+cat+'...';render()}

function setSyncState(s){var d=document.getElementById('syncDot');if(!d)return;d.className='sync-indicator'+(s==='ok'?'':s==='syncing'?' syncing':' error')}

async function apiFetch(path,opts={}){setSyncState('syncing');try{const res=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(res.status===401){doLogout();return null}const data=await res.json();setSyncState('ok');return data}catch(e){setSyncState('error');return null}}

async function loadTasks(){const data=await apiFetch('/tasks?list='+currentList);if(data&&Array.isArray(data)){tasks=data;render()}}

function switchList(list){currentList=list;document.getElementById('tabPersonal').classList.toggle('active',list==='personal');document.getElementById('tabShared').classList.toggle('active',list==='shared');loadTasks()}

function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render()}

async function addTask(){const input=document.getElementById('newTask');const text=input.value.trim();if(!text)return;const body={text,list:currentList};if(currentCat!=='Tout')body.category=currentCat;const result=await apiFetch('/tasks',{method:'POST',body:JSON.stringify(body)});if(result){input.value='';await loadTasks()}input.focus()}

async function toggleDone(id){const t=tasks.find(t=>t.id===id);if(!t)return;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{done:!t.done,doneAt:!t.done?new Date().toISOString():null}})});await loadTasks()}

async function toggleUrgent(id){const t=tasks.find(t=>t.id===id);if(!t)return;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{urgent:!t.urgent}})});await loadTasks()}

async function deleteTask(id){if(!confirm('Supprimer cette tâche ?'))return;await apiFetch('/tasks/'+id+'?list='+currentList,{method:'DELETE'});await loadTasks()}

async function editTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;const newText=prompt('Modifier la tâche :',t.text);if(newText!==null&&newText.trim()){await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{text:newText.trim()}})});await loadTasks()}}

function toggleNote(id){const el=document.getElementById('note-'+id);el.classList.toggle('show');if(el.classList.contains('show'))el.focus()}

async function saveNote(id){const note=document.getElementById('note-'+id).value;await apiFetch('/tasks/'+id,{method:'PUT',body:JSON.stringify({list:currentList,updates:{note}})})}

function formatDate(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function escHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function render(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length,urgent=tasks.filter(t=>t.urgent&&!t.done).length;
  document.getElementById('stats').innerHTML=`<span>${total-done}</span> à faire | <span>${done}</span> terminées${urgent?` | <span>${urgent}</span> urgentes`:''}`;
  
  let filtered=[...tasks];
  // Category filter
  if(currentCat!=='Tout')filtered=filtered.filter(t=>(t.category||'Général')===currentCat);
  // Status filter
  if(currentFilter==='todo')filtered=filtered.filter(t=>!t.done);
  else if(currentFilter==='done')filtered=filtered.filter(t=>t.done);
  else if(currentFilter==='urgent')filtered=filtered.filter(t=>t.urgent&&!t.done);
  
  filtered.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(a.urgent!==b.urgent)return a.urgent?-1:1;return b.id-a.id});
  
  const list=document.getElementById('taskList');
  if(filtered.length===0){list.innerHTML='<div class="empty"><span>✨</span>Aucune tâche !</div>';return}
  
  list.innerHTML=filtered.map(t=>`<li class="task-item ${t.done?'done':''} ${t.urgent?'urgent':''}">
    <div class="task-check" onclick="toggleDone(${t.id})"></div>
    <div class="task-content">
      <div class="task-text">${escHtml(t.text)}</div>
      ${t.note?'<div class="task-note">📝 '+escHtml(t.note)+'</div>':''}
      <textarea class="note-input" id="note-${t.id}" placeholder="Ajouter une note..." onblur="saveNote(${t.id})">${t.note||''}</textarea>
      <div class="task-meta">
        <span class="task-date">${formatDate(t.created_at||t.created)}</span>
        ${t.category?'<span class="task-tag">'+escHtml(t.category)+'</span>':''}
        ${t.urgent?'<span class="task-tag" style="background:#5c1a1a;color:#FF7300">🔴 Urgent</span>':''}
        ${t.created_by&&t.created_by!==currentUser?'<span class="task-tag" style="background:#1a3a5c;color:#6ab0de">👤 '+escHtml(t.created_by)+'</span>':''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-btn" onclick="toggleNote(${t.id})" title="Note">📝</button>
      <button class="task-btn" onclick="toggleUrgent(${t.id})" title="Urgent">${t.urgent?'🔴':'⚪'}</button>
      <button class="task-btn" onclick="editTask(${t.id})" title="Modifier">✏️</button>
      <button class="task-btn del" onclick="deleteTask(${t.id})" title="Supprimer">🗑️</button>
    </div>
  </li>`).join('')}





// ===== NAVIGATION =====
function switchNav(page, btn){
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  var target = page==='tasks'?'pageTasks':page==='qr'?'pageQr':'pageCustoms';
  var el = document.getElementById(target);
  if(el) el.classList.add('active');
  if(page==='customs')hfcInit();
}

function toggleThemeHF(){
  var html=document.documentElement;
  if(html.getAttribute('data-theme')==='dark'){
    html.removeAttribute('data-theme');
    localStorage.setItem('hf_theme','light');
    var tb=document.getElementById('themeToggle');
    if(tb)tb.textContent='🌙';
  } else {
    html.setAttribute('data-theme','dark');
    localStorage.setItem('hf_theme','dark');
    var tb=document.getElementById('themeToggle');
    if(tb)tb.textContent='☀️';
  }
}

// ===== QR CODE =====
var qrLogo = null;

function switchQrType(type, btn) {
  document.querySelectorAll('.qr-type-btn').forEach(function(b){b.classList.remove('active')});
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.qr-form').forEach(function(f){f.style.display='none'});
  if(type==='url') document.getElementById('qrFormUrl').style.display='block';
  else if(type==='text') document.getElementById('qrFormText').style.display='block';
  else if(type==='vcard') document.getElementById('qrFormVcard').style.display='block';
  else if(type==='wifi') document.getElementById('qrFormWifi').style.display='block';
}

function getQRData() {
  var urlForm = document.getElementById('qrFormUrl');
  if(urlForm && urlForm.style.display !== 'none') return (document.getElementById('qrUrl')||{}).value||'';
  
  var textForm = document.getElementById('qrFormText');
  if(textForm && textForm.style.display !== 'none') return (document.getElementById('qrText')||{}).value||'';
  
  var vcardForm = document.getElementById('qrFormVcard');
  if(vcardForm && vcardForm.style.display !== 'none') {
    var fn=(document.getElementById('vcFirst')||{}).value||'';
    var ln=(document.getElementById('vcLast')||{}).value||'';
    var org=(document.getElementById('vcOrg')||{}).value||'';
    var title=(document.getElementById('vcTitle')||{}).value||'';
    var tel=(document.getElementById('vcPhone')||{}).value||'';
    var email=(document.getElementById('vcEmail')||{}).value||'';
    var web=(document.getElementById('vcWeb')||{}).value||'';
    var addr=(document.getElementById('vcAddr')||{}).value||'';
    return 'BEGIN:VCARD\nVERSION:3.0\nN:'+ln+';'+fn+'\nFN:'+fn+' '+ln+'\nORG:'+org+'\nTITLE:'+title+'\nTEL:'+tel+'\nEMAIL:'+email+'\nURL:'+web+'\nADR:;;'+addr+'\nEND:VCARD';
  }
  
  var wifiForm = document.getElementById('qrFormWifi');
  if(wifiForm && wifiForm.style.display !== 'none') {
    var ssid=(document.getElementById('wifiSsid')||{}).value||'';
    var pass=(document.getElementById('wifiPass')||{}).value||'';
    var sec=(document.getElementById('wifiSec')||{}).value||'WPA';
    return 'WIFI:T:'+sec+';S:'+ssid+';P:'+pass+';;';
  }
  return '';
}

function generateQR() {
  var data = getQRData();
  if(!data){alert('Veuillez remplir les champs');return}
  var canvas = document.getElementById('qrCanvas');
  var result = document.getElementById('qrResult');
  if(result) result.style.display='block';
  var opts = {width:300, margin:2, color:{dark:'#000000',light:'#ffffff'}};
  if(typeof QRCode === 'undefined'){
    // Wait for CDN to load
    var waitCount = 0;
    var waitTimer = setInterval(function(){
      waitCount++;
      if(typeof QRCode !== 'undefined'){
        clearInterval(waitTimer);
        generateQR();
      } else if(waitCount > 20){
        clearInterval(waitTimer);
        alert('Erreur: librairie QR non chargee');
      }
    }, 200);
    return;
  }
  QRCode.toCanvas(canvas, data, opts, function(err){
    if(err){alert('Erreur: '+err.message);return}
    if(qrLogo){
      var ctx=canvas.getContext('2d');
      var img=new Image();
      img.onload=function(){
        var s=canvas.width*0.2,x=(canvas.width-s)/2,y=(canvas.height-s)/2;
        ctx.fillStyle='#fff';ctx.fillRect(x-4,y-4,s+8,s+8);ctx.drawImage(img,x,y,s,s);
      };
      img.src=qrLogo;
    }
  });
}

function downloadQR(format) {
  var canvas = document.getElementById('qrCanvas');
  if(!canvas) return;
  var link = document.createElement('a');
  if(format==='svg'){
    // Simple SVG export from canvas
    var imgData = canvas.toDataURL('image/png');
    var svgStr = '<svg xmlns="http://www.w3.org/2000/svg" width="'+canvas.width+'" height="'+canvas.height+'"><image href="'+imgData+'" width="'+canvas.width+'" height="'+canvas.height+'"/></svg>';
    link.download = 'qrcode.svg';
    link.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  } else {
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
  }
  link.click();
}

async function copyQR() {
  try {
    var canvas = document.getElementById('qrCanvas');
    var blob = await new Promise(function(r){canvas.toBlob(r)});
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    alert('QR copie dans le presse-papier!');
  } catch(e) { alert('Copie impossible sur ce navigateur'); }
}

function loadQrLogo(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    qrLogo = e.target.result;
    var preview = document.getElementById('qrLogoPreview');
    if(preview){preview.src=qrLogo;preview.style.display='inline-block'}
    var rmBtn = document.getElementById('qrLogoRemoveBtn');
    if(rmBtn) rmBtn.style.display='inline';
  };
  reader.readAsDataURL(file);
}

function removeQrLogo() {
  qrLogo = null;
  var input = document.getElementById('qrLogoInput');
  if(input) input.value='';
  var preview = document.getElementById('qrLogoPreview');
  if(preview) preview.style.display='none';
  var rmBtn = document.getElementById('qrLogoRemoveBtn');
  if(rmBtn) rmBtn.style.display='none';
}

// ===== HF CUSTOMS =====
async function hfcInit(){
  var tk=localStorage.getItem('hfc_tk');
  if(tk){
    var cl=document.getElementById('customsLogin');if(cl)cl.style.display='none';
    var cp=document.getElementById('customsPanel');if(cp)cp.style.display='block';
    hfcLoadOrders();
  } else {
    // Auto-login: if logged into HectoFlex, try auto-login to HF Customs
    if(currentUser){
      try{
        // Map HectoFlex users to HF Customs credentials
        var creds = {daniel:{u:'daniel',p:'admin2026'},marco:{u:'marco',p:'marco2026'}};
        var c = creds[currentUser];
        if(c){
          var res=await fetch('https://hf-customs.hfcustoms.workers.dev/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:c.u,password:c.p})});
          var d=await res.json();
          if(d.token){
            localStorage.setItem('hfc_tk',d.token);
            localStorage.setItem('hfc_usr',JSON.stringify(d.vendeur||{}));
            var cl=document.getElementById('customsLogin');if(cl)cl.style.display='none';
            var cp=document.getElementById('customsPanel');if(cp)cp.style.display='block';
            hfcLoadOrders();
            return;
          }
        }
      }catch(e){}
    }
    var cl=document.getElementById('customsLogin');if(cl)cl.style.display='block';
    var cp=document.getElementById('customsPanel');if(cp)cp.style.display='none';
  }
}

async function hfcLogin(){
  var u=document.getElementById('hfcUser').value;
  var p=document.getElementById('hfcPass').value;
  var err=document.getElementById('hfcError');
  if(err)err.textContent='';
  try{
    var res=await fetch('https://hf-customs.hfcustoms.workers.dev/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var d=await res.json();
    if(d.token){localStorage.setItem('hfc_tk',d.token);localStorage.setItem('hfc_usr',JSON.stringify(d.vendeur||{}));hfcInit();}
    else{if(err)err.textContent=d.error||'Erreur de connexion'}
  }catch(e){if(err)err.textContent='Erreur reseau'}
}

function hfcLogout(){
  localStorage.removeItem('hfc_tk');localStorage.removeItem('hfc_usr');hfcInit();
}

async function hfcLoadOrders(){
  var tk=localStorage.getItem('hfc_tk');
  try{
    var res=await fetch('https://hf-customs.hfcustoms.workers.dev/api/commandes',{headers:{'Authorization':'Bearer '+tk}});
    if(res.status===401){hfcLogout();return}
    var orders=await res.json();
    var el=document.getElementById('hfcOrders');
    if(!el)return;
    if(!orders.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)"><p>Aucune commande</p></div>';return}
    el.innerHTML=orders.map(function(o){return '<div style="background:var(--surface);padding:12px;border-radius:10px;margin-bottom:8px;border-left:4px solid '+(o.statut==='termine'?'var(--green)':o.statut==='en_cours'?'var(--accent)':'var(--border)')+'"><strong>#'+o.id+' '+o.marque+' '+o.modele+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+o.prestation+' - '+(o.statut||'').replace('_',' ')+'</span></div>'}).join('');
  }catch(e){var el=document.getElementById('hfcOrders');if(el)el.innerHTML='<p style="color:var(--red)">Erreur de chargement</p>'}
}

// Theme init
(function(){
  var t=localStorage.getItem('hf_theme');
  if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');var tb=document.getElementById('themeToggle');if(tb)tb.textContent='☀️';}
})();

</script>

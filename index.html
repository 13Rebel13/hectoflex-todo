<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectoFlex - Tâches</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{background:#16213e;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
.header h1{font-size:20px;color:#e94560}
.user-tabs{display:flex;gap:8px}
.user-tab{padding:8px 20px;border-radius:20px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.user-tab.active{background:#e94560;color:#fff;border-color:#e94560}
.user-tab:hover{border-color:#e94560}
.container{max-width:800px;margin:0 auto;padding:20px}
.add-section{display:flex;gap:10px;margin-bottom:20px}
.add-section input{flex:1;padding:12px 15px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:15px;outline:none}
.add-section input:focus{border-color:#e94560}
.add-section input::placeholder{color:#555}
.add-btn{padding:12px 20px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:15px;cursor:pointer;font-weight:600;white-space:nowrap}
.add-btn:hover{background:#c73651}
.filters{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:15px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:12px}
.filter-btn.active{background:#0f3460;color:#fff;border-color:#0f3460}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin-bottom:8px;background:#16213e;border-radius:10px;border-left:4px solid #0f3460;transition:all .2s}
.task-item.done{opacity:0.5;border-left-color:#2d6a4f}
.task-item.done .task-text{text-decoration:line-through;color:#666}
.task-item.urgent{border-left-color:#e94560}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid #444;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .2s}
.task-check:hover{border-color:#e94560}
.task-item.done .task-check{background:#2d6a4f;border-color:#2d6a4f}
.task-item.done .task-check::after{content:'✓';color:#fff;font-size:13px}
.task-content{flex:1;min-width:0}
.task-text{font-size:15px;line-height:1.4;word-break:break-word}
.task-meta{display:flex;gap:8px;margin-top:5px;align-items:center;flex-wrap:wrap}
.task-date{font-size:11px;color:#555}
.task-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:#0f3460;color:#aaa}
.task-actions{display:flex;gap:6px;flex-shrink:0}
.task-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#666;transition:all .2s}
.task-btn:hover{color:#e94560}
.task-btn.del:hover{color:#ff4444}
.priority-btns{display:flex;gap:4px;margin-left:8px}
.priority-btn{padding:2px 8px;border-radius:8px;border:1px solid #333;background:transparent;color:#666;cursor:pointer;font-size:11px}
.priority-btn.active{background:#e94560;color:#fff;border-color:#e94560}
.empty{text-align:center;padding:60px 20px;color:#444}
.empty span{font-size:40px;display:block;margin-bottom:10px}
.stats{display:flex;gap:15px;margin-bottom:20px;font-size:13px;color:#555}
.stats span{color:#e94560;font-weight:600}
.note-input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #0f3460;background:#1a1a2e;color:#ddd;font-size:13px;margin-top:6px;outline:none;resize:none;display:none}
.note-input.show{display:block}
.task-note{font-size:12px;color:#777;margin-top:4px;font-style:italic}
</style>
</head>
<body>

<div class="header">
<h1>📋 HectoFlex Tâches</h1>
<div class="user-tabs">
<button class="user-tab active" onclick="switchUser('daniel')">Daniel</button>
<button class="user-tab" onclick="switchUser('marco')">Marco</button>
<button class="user-tab" onclick="switchUser('shared')">Commun</button>
</div>
</div>

<div class="container">
<div class="stats" id="stats"></div>

<div class="add-section">
<input type="text" id="newTask" placeholder="Nouvelle tâche..." onkeydown="if(event.key==='Enter')addTask()">
<button class="add-btn" onclick="addTask()">+ Ajouter</button>
</div>

<div class="filters">
<button class="filter-btn active" onclick="setFilter('all')">Tout</button>
<button class="filter-btn" onclick="setFilter('todo')">À faire</button>
<button class="filter-btn" onclick="setFilter('done')">Fait</button>
<button class="filter-btn" onclick="setFilter('urgent')">Urgent</button>
</div>

<ul class="task-list" id="taskList"></ul>
</div>

<script>
let currentUser = 'daniel';
let currentFilter = 'all';

function getKey() { return `hectoflex_tasks_${currentUser}`; }
function getTasks() { return JSON.parse(localStorage.getItem(getKey()) || '[]'); }
function saveTasks(tasks) { localStorage.setItem(getKey(), JSON.stringify(tasks)); }

function switchUser(user) {
  currentUser = user;
  document.querySelectorAll('.user-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function addTask() {
  const input = document.getElementById('newTask');
  const text = input.value.trim();
  if (!text) return;
  const tasks = getTasks();
  tasks.unshift({
    id: Date.now(),
    text: text,
    done: false,
    urgent: false,
    note: '',
    created: new Date().toISOString()
  });
  saveTasks(tasks);
  input.value = '';
  render();
}

function toggleDone(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; t.doneAt = t.done ? new Date().toISOString() : null; }
  saveTasks(tasks);
  render();
}

function toggleUrgent(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id);
  if (t) t.urgent = !t.urgent;
  saveTasks(tasks);
  render();
}

function deleteTask(id) {
  let tasks = getTasks();
  tasks = tasks.filter(t => t.id !== id);
  saveTasks(tasks);
  render();
}

function editTask(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  const newText = prompt('Modifier la tâche :', t.text);
  if (newText !== null && newText.trim()) {
    t.text = newText.trim();
    saveTasks(tasks);
    render();
  }
}

function toggleNote(id) {
  const el = document.getElementById(`note-${id}`);
  el.classList.toggle('show');
  if (el.classList.contains('show')) el.focus();
}

function saveNote(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id);
  if (t) {
    t.note = document.getElementById(`note-${id}`).value;
    saveTasks(tasks);
    render();
  }
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-CH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function render() {
  let tasks = getTasks();
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const urgent = tasks.filter(t => t.urgent && !t.done).length;

  document.getElementById('stats').innerHTML = 
    `<span>${total - done}</span> à faire | <span>${done}</span> terminées${urgent ? ` | <span>${urgent}</span> urgentes` : ''}`;

  if (currentFilter === 'todo') tasks = tasks.filter(t => !t.done);
  else if (currentFilter === 'done') tasks = tasks.filter(t => t.done);
  else if (currentFilter === 'urgent') tasks = tasks.filter(t => t.urgent && !t.done);

  // Sort: urgent first, then by date
  tasks.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    return b.id - a.id;
  });

  const list = document.getElementById('taskList');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty"><span>✨</span>Aucune tâche !</div>';
    return;
  }

  list.innerHTML = tasks.map(t => `
    <li class="task-item ${t.done ? 'done' : ''} ${t.urgent ? 'urgent' : ''}">
      <div class="task-check" onclick="toggleDone(${t.id})"></div>
      <div class="task-content">
        <div class="task-text">${t.text}</div>
        ${t.note ? `<div class="task-note">📝 ${t.note}</div>` : ''}
        <textarea class="note-input" id="note-${t.id}" placeholder="Ajouter une note..." onblur="saveNote(${t.id})">${t.note || ''}</textarea>
        <div class="task-meta">
          <span class="task-date">${formatDate(t.created)}</span>
          ${t.urgent ? '<span class="task-tag" style="background:#5c1a1a;color:#e94560">🔴 Urgent</span>' : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="task-btn" onclick="toggleNote(${t.id})" title="Note">📝</button>
        <button class="task-btn" onclick="toggleUrgent(${t.id})" title="Urgent">${t.urgent ? '🔴' : '⚪'}</button>
        <button class="task-btn" onclick="editTask(${t.id})" title="Modifier">✏️</button>
        <button class="task-btn del" onclick="deleteTask(${t.id})" title="Supprimer">🗑️</button>
      </div>
    </li>
  `).join('');
}

render();
document.getElementById('newTask').focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectoFlex Tools</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#16213e;padding:40px;border-radius:16px;width:100%;max-width:360px;text-align:center}
.login-box h1{color:#e94560;margin-bottom:8px;font-size:24px}
.login-box p{color:#666;margin-bottom:25px;font-size:14px}
.pin-input{width:100%;padding:14px;border-radius:10px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:24px;text-align:center;letter-spacing:12px;outline:none;margin-bottom:15px}
.pin-input:focus{border-color:#e94560}
.login-select{width:100%;padding:12px;border-radius:10px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:15px;margin-bottom:12px;outline:none}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.login-btn:hover{background:#c73651}
.login-error{color:#e94560;font-size:13px;margin-top:10px;display:none}
.app{display:none}
.top-bar{background:#16213e;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
.logo{font-size:20px;font-weight:800;color:#e94560}
.top-right{display:flex;align-items:center;gap:8px}
.user-name{color:#888;font-size:12px}
.logout-btn{padding:4px 10px;border-radius:6px;border:1px solid #333;background:transparent;color:#555;cursor:pointer;font-size:11px}
.logout-btn:hover{color:#e94560;border-color:#e94560}
.main-tabs{display:flex;background:#0d1528;border-bottom:2px solid #0f3460}
.main-tab{flex:1;text-align:center;padding:12px 8px;color:#555;cursor:pointer;font-size:13px;font-weight:600;border-bottom:3px solid transparent}
.main-tab:hover{color:#aaa}
.main-tab.active{color:#e94560;border-bottom-color:#e94560}
.page{display:none}.page.active{display:block}
.tabs-row{display:flex;gap:6px;padding:10px 20px;background:#16213e;flex-wrap:wrap}
.stab{padding:6px 14px;border-radius:16px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:12px;font-weight:600}
.stab.active{background:#e94560;color:#fff;border-color:#e94560}
.stab:hover{border-color:#e94560}
.cat-row{display:flex;gap:5px;padding:6px 20px;background:#121a30;flex-wrap:wrap;align-items:center;border-bottom:1px solid #0f3460}
.cat-chip{padding:4px 10px;border-radius:12px;border:1px solid #1a3a5c;background:transparent;color:#5dade2;cursor:pointer;font-size:11px;font-weight:600}
.cat-chip.active{background:#1a3a5c;color:#fff}
.cat-chip:hover{border-color:#5dade2}
.cat-add{padding:4px 8px;border-radius:12px;border:1px dashed #333;background:transparent;color:#444;cursor:pointer;font-size:11px}
.cat-add:hover{border-color:#e94560;color:#e94560}
.container{max-width:800px;margin:0 auto;padding:12px 20px}
.add-section{display:flex;gap:8px;margin-bottom:6px}
.add-section input[type=text]{flex:1;min-width:120px;padding:10px 12px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:14px;outline:none}
.add-section input:focus{border-color:#e94560}
.add-section input::placeholder{color:#555}
.add-row2{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.add-row2 label{color:#555;font-size:11px}
.date-input,.cat-sel{padding:7px 8px;border-radius:8px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:12px;outline:none}
.add-btn{padding:10px 16px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.add-btn:hover{background:#c73651}
.filters{display:flex;gap:5px;margin-bottom:10px}
.fbtn{padding:3px 10px;border-radius:10px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-size:11px}
.fbtn.active{background:#0f3460;color:#fff;border-color:#0f3460}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:5px;background:#16213e;border-radius:10px;border-left:4px solid #0f3460}
.task-item.done{opacity:0.4;border-left-color:#2d6a4f}
.task-item.done .task-text{text-decoration:line-through;color:#555}
.task-item.urgent{border-left-color:#e94560}
.task-item.overdue{border-left-color:#ff6b35}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid #444;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.task-check:hover{border-color:#e94560}
.task-item.done .task-check{background:#2d6a4f;border-color:#2d6a4f}
.task-item.done .task-check::after{content:'✓';color:#fff;font-size:11px}
.task-content{flex:1;min-width:0}
.task-text{font-size:13px;line-height:1.3}
.task-meta{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tm{font-size:9px;padding:1px 5px;border-radius:5px}
.tm-date{color:#333}
.tm-due{background:#1a3a5c;color:#5dade2}
.tm-due.overdue{background:#5c1a1a;color:#ff6b35}
.tm-due.today{background:#5c4a1a;color:#f4d03f}
.tm-cat{background:#1a3a5c;color:#7fb3d8}
.tm-urg{background:#5c1a1a;color:#e94560}
.tm-own{background:#0f3460;color:#aaa}
.task-actions{display:flex;gap:3px;flex-shrink:0}
.tbtn{width:24px;height:24px;border-radius:5px;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#444}
.tbtn:hover{color:#e94560}
.task-note{font-size:11px;color:#555;margin-top:2px;font-style:italic}
.note-input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#ddd;font-size:11px;margin-top:4px;outline:none;resize:none;display:none}
.note-input.show{display:block}
.empty{text-align:center;padding:40px;color:#333}.empty span{font-size:32px;display:block;margin-bottom:8px}
.stats{display:flex;gap:10px;margin-bottom:8px;font-size:11px;color:#444}.stats b{color:#e94560}
.sync-status{font-size:10px;color:#333;text-align:center;padding:2px}.sync-status.ok{color:#2d6a4f}.sync-status.err{color:#e94560}
.readonly-badge{font-size:10px;padding:3px 10px;border-radius:10px;background:#333;color:#888;margin-bottom:8px;display:inline-block}
.qr-container{max-width:600px;margin:0 auto;padding:20px}
.qr-tabs{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.qtab{padding:8px 14px;border-radius:10px;border:2px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;font-size:12px;font-weight:600}
.qtab.active{background:#e94560;color:#fff;border-color:#e94560}
.qtab:hover{border-color:#e94560}
.fg{margin-bottom:10px}
.fg label{display:block;color:#888;font-size:11px;margin-bottom:3px}
.fg input,.fg textarea,.fg select{width:100%;padding:9px 11px;border-radius:10px;border:2px solid #0f3460;background:#16213e;color:#eee;font-size:13px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:#e94560}
.fg textarea{resize:vertical;min-height:50px}
.frow{display:flex;gap:10px}.frow .fg{flex:1}
.color-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.color-row input[type=color]{width:36px;height:32px;border:none;border-radius:6px;cursor:pointer;background:transparent}
.color-row label{font-size:11px;color:#888}
.gen-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#e94560;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.gen-btn:hover{background:#c73651}
.qr-result{text-align:center;margin-top:20px;display:none}
.qr-result canvas{border-radius:12px;background:#fff;padding:12px;max-width:100%;height:auto!important;aspect-ratio:1/1}
.dl-btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dl-btn{padding:8px 18px;border-radius:10px;border:2px solid #0f3460;background:transparent;color:#5dade2;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}
.dl-btn:hover{border-color:#e94560;color:#e94560}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
<div class="login-box">
<h1>🔧 HectoFlex Tools</h1>
<p>Boîte à outils</p>
<select class="login-select" id="loginUser"><option value="daniel">Daniel</option><option value="marco">Marco</option></select>
<input type="password" class="pin-input" id="pinInput" placeholder="PIN" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
<button class="login-btn" onclick="doLogin()">Connexion</button>
<div class="login-error" id="loginError">PIN incorrect</div>
</div>
</div>
<div class="app" id="app">
<div class="top-bar"><div><span class="logo">🔧 HectoFlex <small style="font-size:10px;color:#444;font-weight:400">v15</small></span></div><div class="top-right"><span class="user-name" id="userName"></span><button class="logout-btn" onclick="doLogout()">⏏</button></div></div>
<div class="main-tabs"><div class="main-tab active" onclick="showPage('tasks',this)">📋 Tâches</div><div class="main-tab" onclick="showPage('qr',this)">📱 QR Code</div></div>
<div class="page active" id="page-tasks">
<div class="tabs-row"><button class="stab active" data-list="personal" onclick="switchList('personal',this)">Mes tâches</button><button class="stab" data-list="shared" onclick="switchList('shared',this)">Commun</button><button class="stab" data-list="other" onclick="switchList('other',this)" id="otherTab">—</button></div>
<div class="cat-row" id="catRow"></div>
<div class="container">
<div class="sync-status" id="syncStatus"></div>
<div class="stats" id="stats"></div>
<div id="addArea">
<div class="add-section"><input type="text" id="newTask" placeholder="Nouvelle tâche..." onkeydown="if(event.key==='Enter')addTask()"><button class="add-btn" onclick="addTask()">+</button></div>
<div class="add-row2"><label>📅</label><input type="date" class="date-input" id="newDue"><label>📁</label><select class="cat-sel" id="newCat"></select></div>
</div>
<div class="filters"><button class="fbtn active" onclick="setFilter('all',this)">Tout</button><button class="fbtn" onclick="setFilter('todo',this)">À faire</button><button class="fbtn" onclick="setFilter('done',this)">Fait</button><button class="fbtn" onclick="setFilter('urgent',this)">Urgent</button></div>
<ul class="task-list" id="taskList"></ul>
</div>
</div>
<div class="page" id="page-qr">
<div class="qr-container">
<div class="qr-tabs"><button class="qtab active" onclick="setQrType('url',this)">🔗 Lien</button><button class="qtab" onclick="setQrType('vcard',this)">👤 vCard</button><button class="qtab" onclick="setQrType('wifi',this)">📶 WiFi</button><button class="qtab" onclick="setQrType('text',this)">📝 Texte</button></div>
<div id="qf-url"><div class="fg"><label>URL</label><input type="url" id="qr-url" placeholder="https://exemple.com"></div><div style="margin-top:6px"><label style="display:flex;align-items:center;gap:8px;color:#5dade2;font-size:12px;cursor:pointer"><input type="checkbox" id="qr-shorten" checked style="width:16px;height:16px;accent-color:#e94560"> Raccourcir l'URL (QR plus simple)</label></div></div>
<div id="qf-vcard" style="display:none"><div class="frow"><div class="fg"><label>Prénom</label><input id="vc-fn"></div><div class="fg"><label>Nom</label><input id="vc-ln"></div></div><div class="fg"><label>Entreprise</label><input id="vc-org"></div><div class="fg"><label>Titre</label><input id="vc-title"></div><div class="fg"><label>Téléphone</label><input id="vc-tel" placeholder="+41 79 123 45 67"></div><div class="fg"><label>Email</label><input id="vc-email"></div><div class="fg"><label>Site web</label><input id="vc-url"></div><div class="fg"><label>Adresse</label><input id="vc-adr"></div></div>
<div id="qf-wifi" style="display:none"><div class="fg"><label>SSID</label><input id="wifi-ssid"></div><div class="fg"><label>Mot de passe</label><input id="wifi-pass"></div><div class="fg"><label>Sécurité</label><select id="wifi-enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="">Aucune</option></select></div></div>
<div id="qf-text" style="display:none"><div class="fg"><label>Texte</label><textarea id="qr-text" rows="3"></textarea></div></div>
<h3 style="font-size:13px;color:#e94560;margin:15px 0 8px">Options</h3>
<div class="fg"><label>Logo au centre (optionnel)</label><input type="file" id="qr-logo" accept="image/*" style="padding:6px;font-size:12px"></div>
<div class="color-row"><label>QR :</label><input type="color" id="qr-fg" value="#000000"><label>Fond :</label><input type="color" id="qr-bg" value="#ffffff"></div>
<div class="fg"><label>Taille (px)</label><input type="number" id="qr-size" value="400" min="100" max="2000" step="50"></div>
<button class="gen-btn" onclick="genQR()">Générer le QR Code</button>
<div class="qr-result" id="qrResult"><canvas id="qrCanvas"></canvas><div class="dl-btns"><a class="dl-btn" id="dlPng" download="qrcode.png">⬇ PNG</a><a class="dl-btn" id="dlSvg" download="qrcode.svg">⬇ SVG</a><button class="dl-btn" id="dlPdf" onclick="dlPDF()">⬇ PDF</button></div></div>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var API='https://hf-tasks-api.hectoflex.workers.dev';
var token=null,currentUser=null,currentList='personal',currentFilter='all',currentCat='all',tasks=[],categories=['Général'];
var OTHER={daniel:'marco',marco:'daniel'},NAMES={daniel:'Daniel',marco:'Marco'};

function showPage(p,el){document.querySelectorAll('.main-tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');document.querySelectorAll('.page').forEach(function(pg){pg.classList.remove('active')});document.getElementById('page-'+p).classList.add('active');}

function api2(p,m,b){
  var o={method:m||'GET',headers:{'Content-Type':'application/json'}};
  if(token) o.headers['Authorization']='Bearer '+token;
  if(b) o.body=JSON.stringify(b);
  return fetch(API+p,o).then(function(r){return r.json();});
}

function doLogin(){
  var u=document.getElementById('loginUser').value,p=document.getElementById('pinInput').value;
  api2('/login','POST',{user:u,pin:p}).then(function(r){
    if(r.ok){token=r.token;currentUser=r.user;localStorage.setItem('hf_token',token);localStorage.setItem('hf_user',currentUser);showApp();}
    else{document.getElementById('loginError').style.display='block';document.getElementById('pinInput').value='';setTimeout(function(){document.getElementById('loginError').style.display='none';},2000);}
  }).catch(function(){document.getElementById('loginError').textContent='Erreur';document.getElementById('loginError').style.display='block';});
}
function doLogout(){localStorage.removeItem('hf_token');localStorage.removeItem('hf_user');token=null;currentUser=null;document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').value='';}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userName').textContent=NAMES[currentUser];document.getElementById('otherTab').textContent=NAMES[OTHER[currentUser]];loadCategories().then(function(){loadTasks();});}
var st=localStorage.getItem('hf_token'),su=localStorage.getItem('hf_user');if(st&&su){token=st;currentUser=su;showApp();}

function switchList(l,el){currentList=l;document.querySelectorAll('.stab').forEach(function(t){t.classList.toggle('active',t.dataset.list===l)});document.getElementById('addArea').style.display=l==='other'?'none':'block';loadTasks();}
function setCatFilter(c){currentCat=c;document.querySelectorAll('.cat-chip').forEach(function(b){b.classList.toggle('active',b.dataset.cat===c)});render();}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active')});el.classList.add('active');render();}
function syncStatus(m,ok){var el=document.getElementById('syncStatus');el.textContent=m;el.className='sync-status '+(ok!==false?'ok':'err');if(ok!==false)setTimeout(function(){el.textContent='';},2000);}
function loadCategories(){return api2('/categories').then(function(c){categories=c&&c.length?c:['Général'];renderCats();}).catch(function(){categories=['Général'];renderCats();});}
function renderCats(){
  var row=document.getElementById('catRow'),sel=document.getElementById('newCat');
  var h='<button class="cat-chip '+(currentCat==='all'?'active':'')+'" data-cat="all" onclick="setCatFilter(\'all\')">Tout</button>';
  categories.forEach(function(c){h+='<button class="cat-chip '+(currentCat===c?'active':'')+'" data-cat="'+c+'" onclick="setCatFilter(\''+c+'\')">'+c+'</button>';});
  h+='<button class="cat-add" onclick="addCat()">+ Dossier</button>';
  row.innerHTML=h;
  sel.innerHTML=categories.map(function(c){return'<option>'+c+'</option>';}).join('');
}
function addCat(){var n=prompt('Nom du dossier :');if(!n||!n.trim())return;api2('/categories','POST',{name:n.trim()}).then(function(c){categories=c;renderCats();});}
function loadTasks(){var lp=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks?list='+lp).then(function(d){tasks=d;syncStatus('✓');render();}).catch(function(){syncStatus('✗ Erreur',false);});}
function addTask(){var i=document.getElementById('newTask'),d=document.getElementById('newDue'),c=document.getElementById('newCat');var t=i.value.trim();if(!t)return;api2('/tasks','POST',{text:t,list:currentList,due_date:d.value||null,category:c.value||'Général'}).then(function(){i.value='';d.value='';loadTasks();});}
function toggleDone(id){var t=tasks.find(function(t){return t.id===id});if(!t)return;var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{done:!t.done}}).then(loadTasks);}
function toggleUrgent(id){var t=tasks.find(function(t){return t.id===id});if(!t)return;var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{urgent:!t.urgent}}).then(loadTasks);}
function deleteTask(id){if(!confirm('Supprimer ?'))return;var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id+'?list='+l,'DELETE').then(loadTasks);}
function editTask(id){var t=tasks.find(function(t){return t.id===id});if(!t)return;var n=prompt('Modifier :',t.text);if(n!==null&&n.trim()){var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{text:n.trim()}}).then(loadTasks);}}
function setDue(id){var t=tasks.find(function(t){return t.id===id});var d=prompt('Échéance (YYYY-MM-DD) :',(t&&t.due_date)||'');if(d!==null){var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{due_date:d||null}}).then(loadTasks);}}
function setCatT(id){var t=tasks.find(function(t){return t.id===id});var c=prompt('Dossier :',(t&&t.category)||'Général');if(c!==null){var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{category:c.trim()||'Général'}}).then(loadTasks);}}
function toggleNote(id){var el=document.getElementById('n-'+id);el.classList.toggle('show');if(el.classList.contains('show'))el.focus();}
function saveNote(id){var v=document.getElementById('n-'+id).value;var l=currentList==='other'?OTHER[currentUser]:currentList;api2('/tasks/'+id,'PUT',{list:l,updates:{note:v}});}
function fmtDate(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function dueS(d){if(!d)return{c:'',l:''};var t=new Date().toISOString().slice(0,10),diff=Math.round((new Date(d)-new Date(t))/864e5);if(diff<0)return{c:'overdue',l:'⚠️ Retard'};if(diff===0)return{c:'today',l:"Auj."};if(diff===1)return{c:'',l:'Demain'};return{c:'',l:d.split('-').reverse().join('/')};}
function render(){
  var f=Array.isArray(tasks)?tasks.slice():[];
  if(currentCat!=='all') f=f.filter(function(t){return(t.category||'Général')===currentCat;});
  var tot=f.length,dn=f.filter(function(t){return t.done}).length,urg=f.filter(function(t){return t.urgent&&!t.done}).length;
  document.getElementById('stats').innerHTML='<b>'+(tot-dn)+'</b> à faire | <b>'+dn+'</b> faites'+(urg?' | <b>'+urg+'</b> urgentes':'');
  if(currentFilter==='todo') f=f.filter(function(t){return!t.done});
  else if(currentFilter==='done') f=f.filter(function(t){return t.done});
  else if(currentFilter==='urgent') f=f.filter(function(t){return t.urgent&&!t.done});
  f.sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;if(a.due_date&&b.due_date)return a.due_date.localeCompare(b.due_date);if(a.due_date&&!b.due_date)return-1;if(!a.due_date&&b.due_date)return 1;if(a.urgent!==b.urgent)return a.urgent?-1:1;return b.id-a.id;});
  var el=document.getElementById('taskList');
  if(!f.length){el.innerHTML='<div class="empty"><span>✨</span>Rien ici</div>';return;}
  var h='';if(currentList==='other')h+='<div class="readonly-badge">👁 '+NAMES[OTHER[currentUser]]+'</div>';
  f.forEach(function(t){var ds=dueS(t.due_date),od=ds.c==='overdue'&&!t.done;
    h+='<li class="task-item '+(t.done?'done':'')+' '+(t.urgent?'urgent':'')+' '+(od?'overdue':'')+'"><div class="task-check" onclick="toggleDone('+t.id+')"></div><div class="task-content"><div class="task-text">'+t.text+'</div>'+(t.note?'<div class="task-note">📝 '+t.note+'</div>':'')+'<textarea class="note-input" id="n-'+t.id+'" onblur="saveNote('+t.id+')">'+(t.note||'')+'</textarea><div class="task-meta"><span class="tm tm-date">'+fmtDate(t.created_at)+'</span>'+(t.due_date?'<span class="tm tm-due '+ds.c+'">📅 '+ds.l+'</span>':'')+(t.category&&t.category!=='Général'?'<span class="tm tm-cat">📁 '+t.category+'</span>':'')+(t.urgent?'<span class="tm tm-urg">Urgent</span>':'')+(t.created_by&&currentList!=='personal'?'<span class="tm tm-own">'+t.created_by+'</span>':'')+'</div></div><div class="task-actions"><button class="tbtn" onclick="setCatT('+t.id+')">📁</button><button class="tbtn" onclick="setDue('+t.id+')">📅</button><button class="tbtn" onclick="toggleNote('+t.id+')">📝</button><button class="tbtn" onclick="toggleUrgent('+t.id+')">'+(t.urgent?'🔴':'⚪')+'</button><button class="tbtn" onclick="editTask('+t.id+')">✏️</button><button class="tbtn" onclick="deleteTask('+t.id+')">🗑️</button></div></li>';
  });el.innerHTML=h;
}

// ===== QR CODE =====
var qrType='url';
function setQrType(t,el){qrType=t;document.querySelectorAll('.qtab').forEach(function(b){b.classList.remove('active')});el.classList.add('active');['url','vcard','wifi','text'].forEach(function(f){document.getElementById('qf-'+f).style.display=f===t?'block':'none';});}
function getQrData(){
  if(qrType==='url') return document.getElementById('qr-url').value;
  if(qrType==='text') return document.getElementById('qr-text').value;
  if(qrType==='wifi'){var s=document.getElementById('wifi-ssid').value,p=document.getElementById('wifi-pass').value,e=document.getElementById('wifi-enc').value;return'WIFI:T:'+e+';S:'+s+';P:'+p+';;';}
  if(qrType==='vcard'){var fn=document.getElementById('vc-fn').value,ln=document.getElementById('vc-ln').value;var v='BEGIN:VCARD\nVERSION:3.0\nN:'+ln+';'+fn+';;;\nFN:'+fn+' '+ln+'\n';
    var add=function(id,pre){var val=document.getElementById(id).value;return val?pre+val+'\n':'';};
    v+=add('vc-org','ORG:')+add('vc-title','TITLE:')+add('vc-tel','TEL;TYPE=CELL:')+add('vc-email','EMAIL:')+add('vc-url','URL:');
    var a=document.getElementById('vc-adr').value;if(a)v+='ADR;TYPE=WORK:;;'+a+';;;;\n';return v+'END:VCARD';}
  return'';
}
function genQR(){
  var data=getQrData();if(!data){alert('Remplis un champ !');return;}
  var shorten=document.getElementById('qr-shorten');
  if(qrType==='url' && shorten && shorten.checked && data.startsWith('http')){
    fetch('https://is.gd/create.php?format=json&url='+encodeURIComponent(data))
      .then(function(r){return r.json();})
      .then(function(r){
        if(r.shorturl) doGenQR(r.shorturl);
        else doGenQR(data);
      }).catch(function(){doGenQR(data);});
  } else if(qrType==='vcard'){
    // Store vCard on server, QR points to short download link
    api2('/vcard','POST',{vcard:data}).then(function(r){
      if(r.short){
        // Shorten the vcard URL with is.gd for even shorter QR
        fetch('https://is.gd/create.php?format=json&url='+encodeURIComponent(r.short))
          .then(function(r2){return r2.json();})
          .then(function(r2){
            doGenQR(r2.shorturl||r.short);
          }).catch(function(){doGenQR(r.short);});
      } else doGenQR(data);
    }).catch(function(){doGenQR(data);});
  } else if(qrType==='text' && data.length > 30){
    api2('/text','POST',{text:data}).then(function(r){
      if(r.short){
        fetch('https://is.gd/create.php?format=json&url='+encodeURIComponent(r.short))
          .then(function(r2){return r2.json();})
          .then(function(r2){doGenQR(r2.shorturl||r.short);})
          .catch(function(){doGenQR(r.short);});
      } else doGenQR(data);
    }).catch(function(){doGenQR(data);});
  } else {
    doGenQR(data);
  }
}
function doGenQR(data){
  
  var fg=document.getElementById('qr-fg').value,bg=document.getElementById('qr-bg').value,size=parseInt(document.getElementById('qr-size').value)||400;
  try{
    var qr=qrcode(0,'L');
    qr.addData(data);
    qr.make();
    var mCount=qr.getModuleCount();
    var canvas=document.getElementById('qrCanvas');
    var cellSize=Math.max(1,Math.floor(size/mCount));
    var realSize=cellSize*mCount;
    canvas.width=realSize;canvas.height=realSize;
    var ctx=canvas.getContext('2d');
    ctx.fillStyle=bg;ctx.fillRect(0,0,realSize,realSize);
    for(var r=0;r<mCount;r++) for(var c=0;c<mCount;c++){
      ctx.fillStyle=qr.isDark(r,c)?fg:bg;
      ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);
    }
    // Overlay logo if selected
    var logoFile=document.getElementById('qr-logo').files[0];
    if(logoFile){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var maxLogo=Math.floor(realSize*0.22);
          var ratio=img.width/img.height;
          var lw,lh;
          if(ratio>=1){lw=maxLogo;lh=Math.floor(maxLogo/ratio);}
          else{lh=maxLogo;lw=Math.floor(maxLogo*ratio);}
          var lx=Math.floor((realSize-lw)/2);
          var ly=Math.floor((realSize-lh)/2);
          var logoSize=maxLogo;
          // White background behind logo
          ctx.fillStyle='#ffffff';
          // Cercle blanc derrière le logo
          var cr=Math.max(lw,lh)/2+6;
          ctx.beginPath();
          ctx.arc(realSize/2,realSize/2,cr,0,Math.PI*2);
          ctx.fillStyle='#ffffff';
          ctx.fill();
          ctx.drawImage(img,lx,ly,lw,lh);
          // Update PNG download
          document.getElementById('dlPng').href=canvas.toDataURL('image/png');
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(logoFile);
    }
    document.getElementById('qrResult').style.display='block';
    document.getElementById('dlPng').href=canvas.toDataURL('image/png');
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+realSize+'" height="'+realSize+'" viewBox="0 0 '+mCount+' '+mCount+'">';
    svg+='<rect width="'+mCount+'" height="'+mCount+'" fill="'+bg+'"/>';
    for(var r=0;r<mCount;r++) for(var c=0;c<mCount;c++){if(qr.isDark(r,c)) svg+='<rect x="'+c+'" y="'+r+'" width="1" height="1" fill="'+fg+'"/>';}
    svg+='</svg>';
    document.getElementById('dlSvg').href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  }catch(e){alert('Erreur: '+e.message);}
}
function dlPDF(){
  var canvas=document.getElementById('qrCanvas');
  var imgData=canvas.toDataURL('image/png');
  var jsPDF=window.jspdf.jsPDF;
  var pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  var mmSize=Math.min(canvas.width*0.264583,180);
  var x=(210-mmSize)/2,y=(297-mmSize)/2;
  pdf.addImage(imgData,'PNG',x,y,mmSize,mmSize);
  pdf.save('qrcode.pdf');
}
